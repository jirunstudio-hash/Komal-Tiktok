<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel - TikTok Live Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f0f13; color: #fff; padding: 15px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 740px; display: flex; flex-direction: column; gap: 14px; }
        
        .card { background: #181820; border: 1px solid #2a2a38; border-radius: 12px; padding: 15px; }
        h3 { font-size: 0.95rem; font-weight: 700; color: #4facfe; margin-bottom: 12px; border-bottom: 1px solid #262635; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        label { font-size: 0.75rem; color: #aaa; font-weight: 600; }
        input, select, button { padding: 9px 12px; border-radius: 6px; border: 1px solid #38384a; background: #22222d; color: #fff; font-size: 0.85rem; outline: none; }
        input:focus, select:focus { border-color: #4facfe; }

        button { cursor: pointer; font-weight: bold; border: none; transition: 0.2s; }
        .btn-green { background: #10b981; } .btn-green:hover { background: #059669; }
        .btn-red { background: #ef4444; } .btn-red:hover { background: #dc2626; }
        .btn-tiktok { background: #fe2c55; color:#fff; } .btn-tiktok:hover { background: #e02447; }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 800; }

        .profile-preview { display: none; align-items: center; gap: 12px; background: #222230; padding: 10px 14px; border-radius: 8px; margin-top: 6px; border: 1px solid #38384a; }
        .profile-preview img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #fe2c55; background: #333; }
        .profile-meta { display: flex; flex-direction: column; font-size: 0.85rem; }

        .slot-manager-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
        .slot-item { background: #20202c; border: 1px solid #2d2d3f; border-radius: 8px; padding: 8px; display: flex; align-items: center; justify-content: space-between; }
        .slot-item-info { font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }

        /* GRID 9 GIFT RESMI */
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }
        @media(min-width: 550px) {
            .gift-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media(min-width: 700px) {
            .gift-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .gift-box {
            background: #20202d;
            border: 1.5px solid #323246;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .gift-box img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            border-radius: 8px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
            background: rgba(0,0,0,0.25);
        }
        .gift-title { font-size: 0.78rem; font-weight: 700; color: #fff; text-align: center; }
        .gift-coin { font-size: 0.68rem; color: #fcd34d; font-weight: 800; background: rgba(245, 158, 11, 0.2); padding: 2px 8px; border-radius: 999px; }

        .video-status {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            text-align: center;
            width: 100%;
        }
        .status-ready { background: #064e3b; color: #34d399; }
        .status-empty { background: #451a1a; color: #f87171; }

        .file-label {
            font-size: 0.68rem;
            color: #93c5fd;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 2px;
        }
        .file-label:hover { color: #bfdbfe; }
        .hidden-file { display: none; }

        .btn-fire-gift {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 7px 4px;
            border-radius: 6px;
            margin-top: 4px;
        }
        .btn-fire-gift:hover { filter: brightness(1.15); }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- 1. IDENTITAS & KONTROL KAMERA DISPLAY -->
        <div class="card">
            <h3>
                <span>1. Identitas Host & Remote Kamera Display</span>
                <span id="remoteCamStatus" style="font-size:0.65rem; color:#aaa; font-weight:normal;">Kamera Standby</span>
            </h3>

            <!-- CARI USERNAME TIKTOK HOST -->
            <div class="form-group">
                <label>Ketik Username TikTok Host (Nama & Foto Otomatis ke Display):</label>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="hostUsernameInput" placeholder="Contoh: atjunior atau @username" style="flex:1;">
                    <button id="btnDetectHost" class="btn-tiktok" onclick="detectHostTikTokUser()">🔍 Cari Akun Host</button>
                </div>
            </div>

            <!-- PREVIEW PROFIL HOST -->
            <div id="hostProfilePreviewBox" class="profile-preview" style="margin-bottom: 12px;">
                <img id="hostPrevImg" src="" alt="Avatar Host" referrerpolicy="no-referrer">
                <div class="profile-meta">
                    <b id="hostPrevNick">Nama Host</b>
                    <span id="hostPrevUser">@username</span>
                </div>
            </div>

            <!-- TOMBOL REMOTE UNTUK MENYALAKAN KAMERA DI DISPLAY SECARA OTOMATIS -->
            <div style="display:flex; gap: 8px;">
                <button id="btnRemoteStartCam" class="btn-green" style="flex:1;" onclick="controlDisplayCamera('start')">🔴 Nyalakan Kamera di Display</button>
                <button id="btnRemoteStopCam" class="btn-red" style="flex:1; display:none;" onclick="controlDisplayCamera('stop')">⏹ Matikan Kamera di Display</button>
            </div>
        </div>

        <!-- 2. DETEKSI USERNAME TIKTOK & PASANG KOTAK 1-8 -->
        <div class="card">
            <h3>2. Deteksi Akun TikTok & Pasang ke Kotak Otomatis</h3>
            
            <div class="form-group">
                <label>Ketik Username TikTok (Tekan Enter / Klik Cari):</label>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="tiktokUsernameInput" placeholder="Contoh: fazgading atau @user" style="flex:1;">
                    <button id="btnDetectTikTok" class="btn-tiktok" onclick="detectTikTokUser()">🔍 Cari di TikTok</button>
                </div>
            </div>

            <div id="profilePreviewBox" class="profile-preview">
                <img id="prevImg" src="" alt="Avatar" referrerpolicy="no-referrer">
                <div class="profile-meta">
                    <b id="prevNick">Nama</b>
                    <span id="prevUser">@username</span>
                </div>
            </div>

            <div class="form-group" style="margin-top:10px;">
                <label>Pilih Kotak Tujuan (1 - 8):</label>
                <select id="targetSlotSelect">
                    <option value="1">Kotak 1</option><option value="2">Kotak 2</option>
                    <option value="3">Kotak 3</option><option value="4">Kotak 4</option>
                    <option value="5">Kotak 5</option><option value="6">Kotak 6</option>
                    <option value="7">Kotak 7</option><option value="8">Kotak 8</option>
                </select>
            </div>

            <button id="btnPlaceSlot" class="btn-green" style="width:100%; margin-top:4px;" onclick="placeUserToSlot()">➕ Pasang ke Kotak Terpilih</button>
        </div>

        <!-- 3. KATALOG 9 GIFT PERMANEN -->
        <div class="card" style="border: 1.5px solid #f59e0b;">
            <h3 style="color:#f59e0b;">
                <span>🎁 3. Katalog Gift TikTok (Notifikasi 3 Detik + Video Full)</span>
                <span style="font-size:0.65rem; color:#10b981; font-weight:normal;">💾 Auto-Saved IndexedDB</span>
            </h3>

            <div class="form-group" style="margin-bottom:10px;">
                <label style="color:#fcd34d;">Pilih Kotak Penerima Gift:</label>
                <select id="targetSlotGift" style="border-color:#f59e0b; background:#29221b; font-weight:bold; font-size:0.95rem;">
                    <option value="1">Kotak 1</option><option value="2">Kotak 2</option>
                    <option value="3">Kotak 3</option><option value="4">Kotak 4</option>
                    <option value="5">Kotak 5</option><option value="6">Kotak 6</option>
                    <option value="7">Kotak 7</option><option value="8">Kotak 8</option>
                </select>
            </div>

            <div class="gift-grid" id="giftCatalogGrid"></div>
        </div>

        <!-- 4. KELOLA & TURUNKAN KOTAK 1-8 -->
        <div class="card">
            <h3>
                <span>4. Kelola & Turunkan Kotak (1 - 8)</span>
                <button class="btn-red" style="font-size:0.75rem; padding: 4px 10px;" onclick="clearAllSlots()">⚠️ TURUNKAN SEMUA KOTAK</button>
            </h3>
            <div class="slot-manager-grid" id="slotManagerContainer"></div>
        </div>

    </div>

    <script>
        const channel = new BroadcastChannel('tiktok_live_channel');

        // PENYIMPAN IDENTITAS PROFIL HOST
        let currentHostProfile = {
            nickname: localStorage.getItem('saved_host_name') || 'Host',
            avatar: localStorage.getItem('saved_host_avatar') || 'https://p16-va-default.akamaized.net/tos-maliva-avt-0068/7334710890691510278~c5_100x100.jpeg',
            username: localStorage.getItem('saved_host_user') || ''
        };

        // REMOTE KONTROL KAMERA DISPLAY (TIDAK MEMBEBANI KOMPUTER)
        function controlDisplayCamera(action) {
            channel.postMessage({
                type: 'TRIGGER_DISPLAY_CAMERA',
                action: action
            });

            const btnStart = document.getElementById('btnRemoteStartCam');
            const btnStop = document.getElementById('btnRemoteStopCam');
            const statusLabel = document.getElementById('remoteCamStatus');

            if (action === 'start') {
                btnStart.style.display = 'none';
                btnStop.style.display = 'inline-block';
                statusLabel.innerText = "🟢 Kamera Aktif di Display";
                statusLabel.style.color = "#10b981";
            } else {
                btnStart.style.display = 'inline-block';
                btnStop.style.display = 'none';
                statusLabel.innerText = "Kamera Standby";
                statusLabel.style.color = "#aaa";
            }
        }

        // ================= DATABASE 9 GIFT RESMI =================
        const GIFTS_DATABASE = [
            { id: 'gift_1', title: 'TikTok Universe', coins: 44999, icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8f471afbcebfda3841a6cc515e381f58~tplv-obj.webp' },
            { id: 'gift_2', title: 'Paus Antariksa', coins: 6000, icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/291de897e4a8c3b72c358a9734c5b7d8.png~tplv-obj.webp' },
            { id: 'gift_3', title: 'Singa (Lion)', coins: 29999, icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4fb89af2082a290b37d704e20f4fe729~tplv-obj.webp' },
            { id: 'gift_4', title: 'Fire Phoenix', coins: 41999, icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/bfb8425a7e8fa03f9fec05a973a4a506.png~tplv-obj.webp' },
            { id: 'gift_5', title: 'Robot Mecha', coins: 39999, icon: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/491bbbd84842fa1089c29d6e61211bb3.png~tplv-obj.webp' },
            { id: 'gift_6', title: 'Naga Api', coins: 26999, icon: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/e5af942cbf6c909da2f11950b1df8b8d.png~tplv-obj.webp' },
            { id: 'gift_7', title: 'Elang Petir', coins: 18999, icon: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/0a295ee8674ff2a9a05ef8e9151bbe75.png~tplv-obj.webp' },
            { id: 'gift_8', title: 'Pegasus', coins: 42999, icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/f600a2495ab5d250e7da2066484a9383.png~tplv-obj.webp' },
            { id: 'gift_9', title: 'Falcon / Lightning', coins: 12000, icon: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/5f48599c8d2a7bbc6e6fcf11ba2c809f~tplv-obj.webp' }
        ];

        const DB_NAME = "TikTokStudioStorageDB";
        const STORE_NAME = "permanent_assets";

        function openDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        async function saveAsset(key, val) {
            const db = await openDB();
            if (!db) return;
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(val, key);
            return tx.complete;
        }

        async function getAsset(key) {
            const db = await openDB();
            if (!db) return null;
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        async function renderGiftsUI() {
            const container = document.getElementById('giftCatalogGrid');
            container.innerHTML = '';

            for (const g of GIFTS_DATABASE) {
                const savedVideo = await getAsset(`video_${g.id}`);
                const hasVideo = !!savedVideo;

                container.innerHTML += `
                    <div class="gift-box" id="box_${g.id}">
                        <img src="${g.icon}" referrerpolicy="no-referrer" crossorigin="anonymous" alt="${g.title}">
                        <span class="gift-title">${g.title}</span>
                        <span class="gift-coin">🪙 ${g.coins.toLocaleString('id-ID')}</span>

                        <span class="video-status ${hasVideo ? 'status-ready' : 'status-empty'}" id="status_${g.id}">
                            ${hasVideo ? '✅ Video Siap' : '⚠️ Belum Ada Video'}
                        </span>

                        <label class="file-label" for="vid_file_${g.id}">📁 Pasang Video (.mp4)</label>
                        <input type="file" id="vid_file_${g.id}" class="hidden-file" accept="video/mp4,video/*" onchange="uploadGiftVideo('${g.id}', event)">

                        <button class="btn-fire-gift" onclick="triggerGift('${g.id}')">🚀 KIRIM GIFT</button>
                    </div>
                `;
            }
        }

        async function uploadGiftVideo(id, e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusElem = document.getElementById(`status_${id}`);
            statusElem.className = "video-status status-ready";
            statusElem.innerText = "⏳ Menyimpan...";

            await saveAsset(`video_${id}`, file);
            statusElem.innerText = "✅ Video Siap (Tersimpan)";
        }

        async function triggerGift(id) {
            const gift = GIFTS_DATABASE.find(g => g.id === id);
            if (!gift) return;

            const targetSlot = parseInt(document.getElementById('targetSlotGift').value);
            const savedVideo = await getAsset(`video_${id}`);

            channel.postMessage({
                type: 'PLAY_GIFT',
                giftId: id,
                giftTitle: gift.title,
                targetSlot: targetSlot,
                increment: gift.coins,
                badgeImg: gift.icon,
                senderName: currentHostProfile.nickname || 'Host',
                senderAvatar: currentHostProfile.avatar || '',
                videoBlob: savedVideo || null
            });
        }

        // ================= DETEKSI PROFIL TIKTOK =================
        function pickNested(obj, keys) {
            if (!obj) return null;
            for (var i = 0; i < keys.length; i++) {
                var parts = keys[i].split('.');
                var curr = obj;
                var found = true;
                for (var j = 0; j < parts.length; j++) {
                    if (curr && typeof curr === 'object' && parts[j] in curr) {
                        curr = curr[parts[j]];
                    } else {
                        found = false;
                        break;
                    }
                }
                if (found && curr !== undefined && curr !== null && curr !== '') return curr;
            }
            return null;
        }

        function extractTikwmUser(raw) {
            if (!raw || typeof raw !== 'object') throw new Error('Respons API kosong');
            var root = raw.data || raw;
            var userInfo = root.userInfo || root.user_info || {};
            var u = userInfo.user || root.user || userInfo || root;

            var username = String(pickNested(u, ['uniqueId', 'unique_id', 'username', 'secUid']) || '').replace(/^@/,'').trim();
            if (!username) throw new Error('Username tidak ditemukan');

            return {
                username: username,
                nickname: String(pickNested(u, ['nickname', 'name', 'display_name']) || username),
                avatar: String(pickNested(u, ['avatarLarger', 'avatarMedium', 'avatarThumb', 'avatar', 'avatar_url']) || '')
            };
        }

        async function requestTikwmUser(username) {
            var clean = encodeURIComponent(username);
            var api = 'https://www.tikwm.com/api/user/info/';
            
            try {
                var r = await fetch(api, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: 'unique_id=' + clean
                });
                if (r.ok) {
                    var j = await r.json();
                    if (j.code === 0 && (j.data || j.userInfo)) return extractTikwmUser(j);
                }
            } catch(e) {}

            var proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(api + '?unique_id=' + clean);
            var resP = await fetch(proxy);
            var jsonP = await resP.json();
            return extractTikwmUser(JSON.parse(jsonP.contents));
        }

        // CARI AKUN TIKTOK HOST
        async function detectHostTikTokUser() {
            var inputVal = document.getElementById('hostUsernameInput').value.trim();
            if (!inputVal) return;

            var cleanUser = inputVal.replace(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\//i, '')
                                    .replace(/^@/, '')
                                    .split(/[/?#]/)[0].trim();

            var btn = document.getElementById('btnDetectHost');
            btn.innerText = "⏳ Mencari...";
            btn.disabled = true;

            try {
                var data = await requestTikwmUser(cleanUser);

                currentHostProfile = {
                    username: data.username,
                    nickname: data.nickname,
                    avatar: data.avatar
                };

                document.getElementById('hostPrevImg').src = data.avatar;
                document.getElementById('hostPrevNick').innerText = data.nickname;
                document.getElementById('hostPrevUser').innerText = '@' + data.username;
                document.getElementById('hostProfilePreviewBox').style.display = 'flex';

                channel.postMessage({
                    type: 'UPDATE_HOST',
                    hostName: data.nickname,
                    hostAvatar: data.avatar
                });

                localStorage.setItem('saved_host_name', data.nickname);
                localStorage.setItem('saved_host_avatar', data.avatar);
                localStorage.setItem('saved_host_user', data.username);

            } catch (err) {
                alert("Akun TikTok Host tidak ditemukan!");
                document.getElementById('hostProfilePreviewBox').style.display = 'none';
            } finally {
                btn.innerText = "🔍 Cari Akun Host";
                btn.disabled = false;
            }
        }

        // CARI AKUN TIKTOK KOMAL
        let currentDetectedProfile = null;

        async function detectTikTokUser() {
            var inputVal = document.getElementById('tiktokUsernameInput').value.trim();
            if (!inputVal) return;

            var cleanUser = inputVal.replace(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\//i, '')
                                    .replace(/^@/, '')
                                    .split(/[/?#]/)[0].trim();

            var btn = document.getElementById('btnDetectTikTok');
            btn.innerText = "⏳ Mencari...";
            btn.disabled = true;

            try {
                var data = await requestTikwmUser(cleanUser);

                currentDetectedProfile = {
                    username: data.username,
                    nickname: data.nickname,
                    avatar: data.avatar
                };

                var prevImg = document.getElementById('prevImg');
                prevImg.src = data.avatar;
                prevImg.referrerPolicy = "no-referrer";

                document.getElementById('prevNick').innerText = data.nickname;
                document.getElementById('prevUser').innerText = '@' + data.username;
                document.getElementById('profilePreviewBox').style.display = 'flex';

            } catch (err) {
                currentDetectedProfile = null;
                document.getElementById('profilePreviewBox').style.display = 'none';
            } finally {
                btn.innerText = "🔍 Cari di TikTok";
                btn.disabled = false;
            }
        }

        document.getElementById('tiktokUsernameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!currentDetectedProfile) {
                    detectTikTokUser();
                } else {
                    placeUserToSlot();
                }
            }
        });

        // PASANG USER KE KOTAK SECARA OTOMATIS
        function placeUserToSlot() {
            const slotSelect = document.getElementById('targetSlotSelect');
            const slotNum = parseInt(slotSelect.value);
            const usernameInput = document.getElementById('tiktokUsernameInput');
            const rawUser = usernameInput.value.trim().replace(/^@+/, '');

            const displayName = currentDetectedProfile ? currentDetectedProfile.nickname : (rawUser || `Slot ${slotNum}`);
            const avatarUrl = currentDetectedProfile ? currentDetectedProfile.avatar : null;

            slotData[slotNum] = { name: displayName, username: rawUser };

            channel.postMessage({
                type: 'UPDATE_SLOT',
                slotNum: slotNum,
                nameInput: displayName,
                initialPoin: 0,
                profileImg: avatarUrl
            });

            renderSlotList();

            usernameInput.value = '';
            currentDetectedProfile = null;
            document.getElementById('profilePreviewBox').style.display = 'none';

            let nextSlot = slotNum + 1;
            if (nextSlot > 8) nextSlot = 1;
            slotSelect.value = nextSlot.toString();

            usernameInput.focus();

            const btn = document.getElementById('btnPlaceSlot');
            if (btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = `✅ Kotak ${slotNum} Terpasang! ⏩ Siap Kotak ${nextSlot}`;
                btn.style.background = '#059669';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 1200);
            }
        }

        // ================= KELOLA KOTAK =================
        const slotData = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null, 7: null, 8: null };

        function renderSlotList() {
            const container = document.getElementById('slotManagerContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const s = slotData[i];
                const name = s ? s.name : '<span style="color:#666;">(Kosong)</span>';
                container.innerHTML += `
                    <div class="slot-item">
                        <div class="slot-item-info"><b>Kotak ${i}:</b> ${name}</div>
                        <button class="btn-red" style="font-size:0.7rem; padding: 4px 8px;" onclick="clearSingleSlot(${i})">Turunkan</button>
                    </div>
                `;
            }
        }

        function clearSingleSlot(slotNum) {
            slotData[slotNum] = null;
            channel.postMessage({ type: 'UPDATE_SLOT', slotNum: slotNum, action: 'clear_slot' });
            renderSlotList();
        }

        function clearAllSlots() {
            for (let i = 1; i <= 8; i++) {
                slotData[i] = null;
                channel.postMessage({ type: 'UPDATE_SLOT', slotNum: i, action: 'clear_slot' });
            }
            renderSlotList();
        }

        window.onload = () => {
            const savedHostName = localStorage.getItem('saved_host_name');
            const savedHostUser = localStorage.getItem('saved_host_user');
            const savedHostAvatar = localStorage.getItem('saved_host_avatar');

            if (savedHostUser) {
                document.getElementById('hostUsernameInput').value = savedHostUser;
            }
            if (savedHostAvatar) {
                document.getElementById('hostPrevImg').src = savedHostAvatar;
                document.getElementById('hostPrevNick').innerText = savedHostName || 'Host';
                document.getElementById('hostPrevUser').innerText = '@' + (savedHostUser || '');
                document.getElementById('hostProfilePreviewBox').style.display = 'flex';
                currentHostProfile = { nickname: savedHostName, avatar: savedHostAvatar, username: savedHostUser };
            }
            if (savedHostName || savedHostAvatar) {
                channel.postMessage({ 
                    type: 'UPDATE_HOST', 
                    hostName: savedHostName || 'Host',
                    hostAvatar: savedHostAvatar || ''
                });
            }
            renderGiftsUI();
            renderSlotList();
        };
    </script>
</body>
</html>
