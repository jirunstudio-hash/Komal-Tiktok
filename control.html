<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel - TikTok Live Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f0f13; color: #fff; padding: 15px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 14px; }
        
        .card { background: #181820; border: 1px solid #2a2a38; border-radius: 12px; padding: 15px; }
        h3 { font-size: 0.95rem; font-weight: 700; color: #4facfe; margin-bottom: 12px; border-bottom: 1px solid #262635; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        label { font-size: 0.75rem; color: #aaa; font-weight: 600; }
        input, select, button { padding: 9px 12px; border-radius: 6px; border: 1px solid #38384a; background: #22222d; color: #fff; font-size: 0.85rem; outline: none; }
        input:focus, select:focus { border-color: #4facfe; }

        button { cursor: pointer; font-weight: bold; border: none; transition: 0.2s; }
        .btn-green { background: #10b981; } .btn-green:hover { background: #059669; }
        .btn-red { background: #ef4444; } .btn-red:hover { background: #dc2626; }
        .btn-blue { background: #2563eb; } .btn-blue:hover { background: #1d4ed8; }
        .btn-tiktok { background: #fe2c55; color:#fff; } .btn-tiktok:hover { background: #e02447; }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 800; font-size: 0.95rem; padding: 12px; }
        .btn-gold:hover { filter: brightness(1.1); }

        .cam-preview-box { width: 100%; height: 140px; background: #000; border-radius: 8px; border: 1px dashed #444; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 8px; }
        #camPreviewVideo { width: 100%; height: 100%; object-fit: cover; display: none; }

        .profile-preview { display: none; align-items: center; gap: 12px; background: #222230; padding: 10px 14px; border-radius: 8px; margin-top: 6px; border: 1px solid #38384a; }
        .profile-preview img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #fe2c55; background: #333; }
        .profile-meta { display: flex; flex-direction: column; font-size: 0.85rem; }
        .profile-meta b { color: #fff; font-size: 0.9rem; }
        .profile-meta span { color: #aaa; font-size: 0.75rem; margin-top: 2px; }

        .slot-manager-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
        .slot-item { background: #20202c; border: 1px solid #2d2d3f; border-radius: 8px; padding: 8px; display: flex; align-items: center; justify-content: space-between; }
        .slot-item-info { font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- 1. KAMERA HOST -->
        <div class="card">
            <h3>1. Kamera Host Realtime</h3>
            <div style="display:flex; gap: 8px;">
                <button id="btnStartCam" class="btn-green" style="flex:1;" onclick="startCamera()">🔴 Aktifkan Kamera Host</button>
                <button id="btnStopCam" class="btn-red" style="flex:1; display:none;" onclick="stopCamera()">⏹ Matikan Kamera</button>
            </div>
            <div class="cam-preview-box">
                <span id="camPlaceholder" style="font-size:0.75rem; color:#666;">Preview Kamera Panel Operator</span>
                <video id="camPreviewVideo" autoplay playsinline muted></video>
            </div>
        </div>

        <!-- 2. DETEKSI USERNAME TIKTOK & PASANG KOTAK 1-8 -->
        <div class="card">
            <h3>2. Deteksi Akun TikTok Asli & Pasang ke Kotak</h3>
            
            <div class="form-group">
                <label>Ketik Username TikTok (Cari Akun Asli):</label>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="tiktokUsernameInput" placeholder="Contoh: fazgading atau @user" style="flex:1;">
                    <button id="btnDetectTikTok" class="btn-tiktok" onclick="detectTikTokUser()">🔍 Cari di TikTok</button>
                </div>
            </div>

            <!-- Preview Data Asli -->
            <div id="profilePreviewBox" class="profile-preview">
                <img id="prevImg" src="" alt="Avatar" referrerpolicy="no-referrer">
                <div class="profile-meta">
                    <b id="prevNick">Nama</b>
                    <span id="prevUser">@username</span>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                <div class="form-group">
                    <label>Pilih Kotak Tujuan (1 - 8):</label>
                    <select id="targetSlotSelect">
                        <option value="1">Kotak 1</option><option value="2">Kotak 2</option>
                        <option value="3">Kotak 3</option><option value="4">Kotak 4</option>
                        <option value="5">Kotak 5</option><option value="6">Kotak 6</option>
                        <option value="7">Kotak 7</option><option value="8">Kotak 8</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Koin Awal:</label>
                    <input type="number" id="initCoinInput" value="0">
                </div>
            </div>

            <button class="btn-green" style="width:100%; margin-top:4px;" onclick="placeUserToSlot()">➕ Pasang ke Kotak Terpilih</button>
        </div>

        <!-- 3. KELOLA & TURUNKAN KOTAK 1-8 -->
        <div class="card">
            <h3>
                <span>3. Kelola & Turunkan Kotak (1 - 8)</span>
                <button class="btn-red" style="font-size:0.75rem; padding: 4px 10px;" onclick="clearAllSlots()">⚠️ TURUNKAN SEMUA KOTAK</button>
            </h3>
            
            <div class="slot-manager-grid" id="slotManagerContainer"></div>
        </div>

        <!-- 4 & 5. VIDEO ANIMASI GALERI & POIN MANUAL -->
        <div class="card" style="border: 1px solid #f59e0b;">
            <h3 style="color:#f59e0b;">4 & 5. Video Animasi Galeri & Poin Manual</h3>

            <div class="form-group">
                <label>Pilih Video Animasi dari Galeri HP/Laptop (.mp4 Green Screen):</label>
                <input type="file" id="giftGalleryFile" accept="video/mp4,video/*" onchange="handleGalleryVideo(event)">
                <span id="galleryFileStatus" style="font-size:0.7rem; color:#10b981; margin-top:2px;"></span>
                <input type="text" id="giftUrlInput" placeholder="Atau paste link URL video animasi..." style="margin-top:4px;">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="form-group">
                    <label>Target Kotak Penerima Koin:</label>
                    <select id="giftTargetSlot">
                        <option value="1">Kotak 1</option><option value="2">Kotak 2</option>
                        <option value="3">Kotak 3</option><option value="4">Kotak 4</option>
                        <option value="5">Kotak 5</option><option value="6">Kotak 6</option>
                        <option value="7">Kotak 7</option><option value="8">Kotak 8</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Poin Koin Gift (Manual):</label>
                    <input type="number" id="manualPointInput" value="44999">
                </div>
            </div>

            <button class="btn-gold" style="width:100%; margin-top:8px;" onclick="sendGiftAnimation()">🎁 KIRIM ANIMASI KE DISPLAY</button>
        </div>

    </div>

    <canvas id="camCanvas" width="360" height="640" style="display:none;"></canvas>

    <script>
        const channel = new BroadcastChannel('tiktok_live_channel');

        const slotData = {
            1: null, 2: null, 3: null, 4: null,
            5: null, 6: null, 7: null, 8: null
        };

        let currentDetectedProfile = null;
        let selectedGiftBase64 = "";

        function renderSlotList() {
            const container = document.getElementById('slotManagerContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const s = slotData[i];
                const name = s ? s.name : '<span style="color:#666;">(Kosong)</span>';
                container.innerHTML += `
                    <div class="slot-item">
                        <div class="slot-item-info"><b>Kotak ${i}:</b> ${name}</div>
                        <button class="btn-red" style="font-size:0.7rem; padding: 4px 8px;" onclick="clearSingleSlot(${i})">Turunkan</button>
                    </div>
                `;
            }
        }
        renderSlotList();

        // ================= 1. KAMERA REALTIME =================
        let camStream = null;
        let camInterval = null;

        async function startCamera() {
            try {
                camStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 480 }, height: { ideal: 640 }, facingMode: 'user' },
                    audio: false
                });

                const preview = document.getElementById('camPreviewVideo');
                preview.srcObject = camStream;
                preview.style.display = 'block';
                document.getElementById('camPlaceholder').style.display = 'none';

                document.getElementById('btnStartCam').style.display = 'none';
                document.getElementById('btnStopCam').style.display = 'inline-block';

                const canvas = document.getElementById('camCanvas');
                const ctx = canvas.getContext('2d');

                camInterval = setInterval(() => {
                    if (preview.readyState >= preview.HAVE_CURRENT_DATA) {
                        ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);
                        const frameData = canvas.toDataURL('image/jpeg', 0.6);
                        channel.postMessage({ type: 'HOST_CAM_FRAME', frame: frameData });
                    }
                }, 33);
            } catch (err) {
                alert("Izin kamera ditolak atau tidak ditemukan: " + err.message);
            }
        }

        function stopCamera() {
            if (camInterval) { clearInterval(camInterval); camInterval = null; }
            if (camStream) {
                camStream.getTracks().forEach(t => t.stop());
                camStream = null;
            }
            const preview = document.getElementById('camPreviewVideo');
            preview.srcObject = null;
            preview.style.display = 'none';
            document.getElementById('camPlaceholder').style.display = 'block';

            document.getElementById('btnStartCam').style.display = 'inline-block';
            document.getElementById('btnStopCam').style.display = 'none';

            channel.postMessage({ type: 'HOST_CAM_STOP' });
        }

        // ================= 2. API TIKWM ASLI =================
        function pickNested(obj, keys) {
            if (!obj) return null;
            for (var i = 0; i < keys.length; i++) {
                var parts = keys[i].split('.');
                var curr = obj;
                var found = true;
                for (var j = 0; j < parts.length; j++) {
                    if (curr && typeof curr === 'object' && parts[j] in curr) {
                        curr = curr[parts[j]];
                    } else {
                        found = false;
                        break;
                    }
                }
                if (found && curr !== undefined && curr !== null && curr !== '') {
                    return curr;
                }
            }
            return null;
        }

        function extractTikwmUser(raw) {
            if (!raw || typeof raw !== 'object') throw new Error('Respons API kosong');
            if (raw.code !== undefined && Number(raw.code) !== 0) throw new Error(raw.msg || ('API code ' + raw.code));
            var root = raw.data || raw;
            var userInfo = root.userInfo || root.user_info || {};
            var u = userInfo.user || root.user || userInfo || root;

            var username = String(pickNested(u, ['uniqueId', 'unique_id', 'username', 'secUid']) || '').replace(/^@/,'').trim();
            if (!username) throw new Error('Username tidak ada pada respons API');

            return {
                username: username,
                nickname: String(pickNested(u, ['nickname', 'name', 'display_name']) || username),
                avatar: String(pickNested(u, ['avatarLarger', 'avatarMedium', 'avatarThumb', 'avatar', 'avatar_url']) || '')
            };
        }

        function requestTikwmUser(username) {
            var api = 'https://www.tikwm.com/api/user/info/';
            var body = 'unique_id=' + encodeURIComponent(username);
            return fetch(api, {
                method: 'POST',
                cache: 'no-store',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                    'Accept': 'application/json, text/plain, */*'
                },
                body: body
            }).then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            }).then(function(t) {
                var j;
                try { j = JSON.parse(t); } catch (_) { throw new Error('Bukan JSON'); }
                return extractTikwmUser(j);
            });
        }

        async function detectTikTokUser() {
            var inputVal = document.getElementById('tiktokUsernameInput').value.trim();
            if (!inputVal) return alert("Ketik username TikTok terlebih dahulu!");

            var cleanUser = inputVal.replace(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\//i, '')
                                    .replace(/^@/, '')
                                    .split(/[/?#]/)[0].trim();

            var btn = document.getElementById('btnDetectTikTok');
            btn.innerText = "⏳ Mencari Data Asli...";
            btn.disabled = true;

            try {
                var data = await requestTikwmUser(cleanUser);

                currentDetectedProfile = {
                    username: data.username,
                    nickname: data.nickname,
                    avatar: data.avatar
                };

                var prevImg = document.getElementById('prevImg');
                prevImg.src = data.avatar;
                prevImg.referrerPolicy = "no-referrer";

                document.getElementById('prevNick').innerText = data.nickname;
                document.getElementById('prevUser').innerText = '@' + data.username;
                document.getElementById('profilePreviewBox').style.display = 'flex';

            } catch (err) {
                console.warn("Gagal TikWM asli:", err);
                alert("Gagal mendeteksi akun @" + cleanUser + ": " + (err.message || "Periksa kembali username Anda."));
                currentDetectedProfile = null;
                document.getElementById('profilePreviewBox').style.display = 'none';
            } finally {
                btn.innerText = "🔍 Cari di TikTok";
                btn.disabled = false;
            }
        }

        function placeUserToSlot() {
            const slotNum = parseInt(document.getElementById('targetSlotSelect').value);
            const coin = parseInt(document.getElementById('initCoinInput').value) || 0;
            const rawUser = document.getElementById('tiktokUsernameInput').value.trim().replace(/^@+/, '');

            const displayName = currentDetectedProfile ? currentDetectedProfile.nickname : (rawUser || `Slot ${slotNum}`);
            const avatarUrl = currentDetectedProfile ? currentDetectedProfile.avatar : null;

            slotData[slotNum] = { name: displayName, username: rawUser };

            channel.postMessage({
                type: 'UPDATE_SLOT',
                slotNum: slotNum,
                nameInput: displayName,
                initialPoin: coin,
                profileImg: avatarUrl
            });

            renderSlotList();
            alert(`✅ Berhasil dipasang ke Kotak ${slotNum}!`);
        }

        // ================= 3. TURUNKAN KOTAK =================
        function clearSingleSlot(slotNum) {
            slotData[slotNum] = null;
            channel.postMessage({
                type: 'UPDATE_SLOT',
                slotNum: slotNum,
                action: 'clear_slot'
            });
            renderSlotList();
        }

        function clearAllSlots() {
            if (!confirm("Turunkan semua orang dari Kotak 1 sampai 8?")) return;
            for (let i = 1; i <= 8; i++) {
                slotData[i] = null;
                channel.postMessage({
                    type: 'UPDATE_SLOT',
                    slotNum: i,
                    action: 'clear_slot'
                });
            }
            renderSlotList();
            alert("✅ Kotak 1 - 8 telah bersih.");
        }

        // ================= 4 & 5. VIDEO ANIMASI GALERI & POIN MANUAL =================
        function handleGalleryVideo(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('galleryFileStatus').innerText = `⏳ Memproses: ${file.name}...`;

            const reader = new FileReader();
            reader.onload = (ev) => {
                selectedGiftBase64 = ev.target.result;
                document.getElementById('giftUrlInput').value = "";
                document.getElementById('galleryFileStatus').innerText = `✅ Video galeri siap: ${file.name}`;
            };
            reader.readAsDataURL(file);
        }

        function sendGiftAnimation() {
            const src = selectedGiftBase64 || document.getElementById('giftUrlInput').value.trim();
            const target = parseInt(document.getElementById('giftTargetSlot').value);
            const point = parseInt(document.getElementById('manualPointInput').value) || 0;

            if (!src) {
                alert("Pilih file video animasi dari galeri atau masukkan link video terlebih dahulu!");
                return;
            }

            channel.postMessage({
                type: 'PLAY_GIFT',
                src: src,
                targetSlot: target,
                increment: point
            });
        }
    </script>
</body>
</html>
