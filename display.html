<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Studio - TikTok Live HD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0b0e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        /* KOTAK UTAMA LAYAR POTRET TIKTOK LIVE STUDIO (FULL SCREEN & GARIS BAWAH DIKEATASKAN) */
        .phone-screen { 
            height: calc(100vh - 40px); 
            width: 100vw; 
            max-width: 440px; 
            background: #000; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center; 
            padding: 10px 10px 0 10px; 
            box-shadow: 0 0 40px rgba(0,0,0,0.8); 
            border: 2px solid #222; 
            border-radius: 0;
            margin-bottom: 30px; /* Garis bawah dinaikkan agak ke atas */
        }

        /* ===== AREA KOTAK KOMAL & HOST (DI BELAKANG VIDEO GIFT) ===== */
        .live-layout { 
            display: flex; gap: 8px; width: 100%; max-width: 400px; 
            position: relative; 
            z-index: 10; 
            align-items: stretch; 
        }

        /* ANIMASI GARIS BIRU HOST */
        @keyframes hostBluePulse {
            0%, 100% { border-color: #00d2ff; box-shadow: 0 0 14px rgba(0, 210, 255, 0.8), inset 0 0 8px rgba(0, 210, 255, 0.35); }
            50% { border-color: rgba(0, 150, 255, 0.3); box-shadow: 0 0 4px rgba(0, 150, 255, 0.2), inset 0 0 0px rgba(0, 0, 0, 0); }
        }

        /* KOTAK HOST */
        .host-box { 
            flex: 1; height: auto; min-height: 380px; 
            background: #16161c; 
            border-radius: 0; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; 
            border: 2px solid #00d2ff; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
            animation: hostBluePulse 1.2s infinite ease-in-out;
            cursor: pointer;
        }
        .host-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: none; }
        #hostCameraImg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 3; display: none; }
        .host-placeholder { color: #888; font-size: 0.8rem; font-weight: 500; text-align: center; z-index: 1; }

        .host-top-pill { position: absolute; top: 8px; left: 8px; z-index: 12; }
        .gold-host-badge { background: linear-gradient(135deg, #e5a93c 0%, #d48b17 100%); color: #fff; font-size: 0.55rem; font-weight: 800; padding: 2px 7px; border-radius: 3px; }

        /* GRID KOMAL (KOTAK 1 - 8) */
        .komal-grid { 
            width: 192px; display: grid; grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(4, 1fr); gap: 6px; flex-shrink: 0; position: relative; z-index: 10; 
        }

        /* KOTAK SLOT KOMAL */
        .slot-box { 
            width: 100%; aspect-ratio: 1 / 1; 
            background: #202127; 
            border-radius: 0; 
            position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border: 1.5px solid rgba(255, 255, 255, 0.22); 
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7);
            transition: all 0.25s ease;
        }

        .slot-bg-blur { position: absolute !important; inset: -20px !important; width: calc(100% + 40px) !important; height: calc(100% + 40px) !important; object-fit: cover !important; filter: blur(14px) brightness(0.65) contrast(1.05) !important; transform: scale(1.2) !important; display: none; z-index: 1; pointer-events: none; }
        .slot-bg-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.25); display: none; z-index: 2; pointer-events: none; }
        .slot-icon { color: rgba(255, 255, 255, 0.65); font-size: 1.35rem; margin-bottom: 2px; font-weight: 800; z-index: 3; line-height: 1; }
        .slot-req { color: rgba(255, 255, 255, 0.70); font-size: 0.54rem; font-weight: 700; z-index: 3; }

        .slot-circle-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 4; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6); }

        /* BADGE BINTANG BIRU KIRI ATAS */
        .slot-coin-badge { 
            position: absolute; top: 4px; left: 4px; display: flex; align-items: center; gap: 4px; 
            background: rgba(14, 14, 16, 0.88); backdrop-filter: blur(8px); padding: 2px 7px 2px 3px; border-radius: 999px; z-index: 6; border: 0.5px solid rgba(255, 255, 255, 0.12);
        }
        .cyan-diamond-circle { 
            width: 14px; height: 14px; background: radial-gradient(circle at center, #ffffff 15%, #38bdf8 52%, #0077ff 95%); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px rgba(0, 210, 255, 0.95), 0 0 2px #ffffff; border: 1.2px solid #ffffff; flex-shrink: 0;
        }
        .star-svg { width: 7.5px; height: 7.5px; fill: #ffffff; filter: drop-shadow(0 0 2px rgba(255,255,255,0.9)); }
        .coin-count { font-size: 0.58rem; color: #ffffff; font-weight: 800; line-height: 1; }

        /* FOTO GIFT DI KANAN ATAS (POP-UP 5 DETIK) */
        @keyframes popGiftBadge {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .slot-top-badge {
            position: absolute; top: 4px; right: 4px; z-index: 8;
            width: 25px; height: 25px; display: none; object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.95));
            pointer-events: none;
            animation: popGiftBadge 0.3s ease-out;
        }

        /* PILL NAMA KIRI BAWAH */
        .slot-name-pill { 
            position: absolute; bottom: 4px; left: 4px; max-width: calc(100% - 32px); 
            display: flex; align-items: center; gap: 4px; z-index: 6; 
            background: rgba(14, 14, 16, 0.88); backdrop-filter: blur(8px);
            padding: 2px 3px 2px 7px; border-radius: 999px; border: 0.5px solid rgba(255, 255, 255, 0.12);
        }
        .slot-name-text { color: #ffffff; font-size: 0.52rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46px; }

        .slot-plus-circle { 
            width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); 
            position: relative; flex-shrink: 0;
        }
        .slot-plus-circle::before, .slot-plus-circle::after { content: ''; position: absolute; background: #ffffff; border-radius: 1px; }
        .slot-plus-circle::before { top: 6px; left: 3px; width: 8px; height: 2px; }
        .slot-plus-circle::after { top: 3px; left: 6px; width: 2px; height: 8px; }

        /* MIC KANAN BAWAH DICORET */
        .mic-container { 
            position: absolute; bottom: 4px; right: 4px; z-index: 6; 
            width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; 
            background: rgba(14, 14, 16, 0.88); backdrop-filter: blur(8px);
            border-radius: 50%; border: 0.5px solid rgba(255, 255, 255, 0.12);
        }
        .mic-icon-svg { width: 12px; height: 12px; display: block; }

        /* ===== AREA VIDEO GIFT (DI DEPAN LAYAR KOTAK & DIKEATASKAN) ===== */
        .gift-overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 50; /* Memastikan video berada di depan kotak-kotak */
            pointer-events: none; 
            display: none; 
            background: transparent; 
        }
        #giftVideo { 
            display: none; 
        }
        #giftCanvas { 
            width: 100%; height: 100%; 
            object-fit: contain; 
            object-position: center 20%; /* Posisi video dinaikkan ke atas menutup kotak */
            display: block;
            pointer-events: none;
            transform: translateY(-20px); /* Geser agak ke atas */
        }
    </style>
</head>
<body>
<div class="phone-screen" id="displayContainer">

    <!-- AREA ATAS (HOST & KOTAK 1 - 8) BERADA DI BELAKANG VIDEO -->
    <div class="live-layout">
        <!-- Kotak Host bisa diklik langsung untuk menyalakan kamera lokal -->
        <div class="host-box" id="hostBox" onclick="startDisplayDirectCamera()" title="Klik untuk aktifkan kamera lokal display">
            <div class="host-top-pill"><span class="gold-host-badge">Host</span></div>
            <div id="hostPlaceholder" class="host-placeholder">Host Video / Kamera</div>
            <video id="hostVideo" class="host-video" loop autoplay playsinline muted></video>
            <img id="hostCameraImg" alt="Host Cam">
        </div>

        <div class="komal-grid" id="komalGrid">
            <script>
                for(let i = 1; i <= 8; i++) {
                    document.write(`
                        <div class="slot-box" id="slot-${i}">
                            <img id="bg-slot-${i}" class="slot-bg-blur" referrerpolicy="no-referrer">
                            <div class="slot-bg-overlay" id="overlay-slot-${i}"></div>

                            <div class="slot-coin-badge" id="coin-badge-${i}" style="display:none;">
                                <div class="cyan-diamond-circle">
                                    <svg class="star-svg" viewBox="0 0 24 24"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/></svg>
                                </div>
                                <span class="coin-count" id="coincount-slot-${i}">0</span>
                            </div>

                            <img class="slot-top-badge" id="topbadge-slot-${i}" referrerpolicy="no-referrer" crossorigin="anonymous" alt="Gift">

                            <span class="slot-icon" id="icon-${i}">+</span>
                            <span class="slot-req" id="req-${i}">Permintaan</span>
                            
                            <img id="img-slot-${i}" class="slot-circle-img" referrerpolicy="no-referrer">
                            
                            <div class="slot-name-pill" id="namepill-slot-${i}" style="display:none;">
                                <span class="slot-name-text" id="nametext-slot-${i}">Slot ${i}</span>
                                <div class="slot-plus-circle"></div>
                            </div>

                            <div class="mic-container" id="mic-slot-${i}" style="display:none;">
                                <svg class="mic-icon-svg" viewBox="0 0 24 24">
                                    <path fill="#ffffff" d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                                    <path fill="#ffffff" d="M19 10v1a7 7 0 0 1-6 6.93V20h3v2H8v-2h3v-2.07A7 7 0 0 1 5 11v-1h2v1a5 5 0 0 0 10 0v-1h2z"/>
                                    <line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="#0e0e10" stroke-width="3.5" stroke-linecap="round"/>
                                    <line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <!-- AREA VIDEO GIFT (MUNCUL DI DEPAN LAYAR KOTAK DENGAN CHROMA GREEN SCREEN OTOMATIS) -->
    <div class="gift-overlay" id="giftOverlayContainer">
        <video id="giftVideo" playsinline crossorigin="anonymous"></video>
        <canvas id="giftCanvas"></canvas>
    </div>
</div>

<script>
    const channel = new BroadcastChannel('tiktok_live_channel');
    const slotPoints = {};
    const badgeTimers = {};
    let animFrameId = null;
    let displayCamStream = null;
    
    // WATCHDOG UNTUK DETEKSI JIKA KONTROL PUTUS / KAMERA KONTROL MATI
    let controlWatchdogTimer = null;
    let isUsingControlStream = false;

    for(let i=1; i<=8; i++) slotPoints[i] = 0;

    // FUNGSI AKTIFKAN KAMERA LANGSUNG DI DISPLAY (FALLBACK)
    async function startDisplayDirectCamera() {
        try {
            const hVid = document.getElementById('hostVideo');
            const camImg = document.getElementById('hostCameraImg');
            
            camImg.style.display = 'none';
            camImg.src = '';

            if (!displayCamStream) {
                displayCamStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 480 }, height: { ideal: 640 }, facingMode: 'user' },
                    audio: false
                });
            }
            hVid.srcObject = displayCamStream;
            hVid.style.display = 'block';
            document.getElementById('hostPlaceholder').style.display = 'none';
            await hVid.play().catch(()=>{});
        } catch(err) {
            console.log("Kamera lokal display aktif/error:", err);
        }
    }

    // RESET WATCHDOG SETIAP FRAME DITERIMA DARI KONTROL
    function feedWatchdog() {
        isUsingControlStream = true;
        if (controlWatchdogTimer) clearTimeout(controlWatchdogTimer);
        
        controlWatchdogTimer = setTimeout(() => {
            if (isUsingControlStream) {
                console.log("Stream kontrol terhenti, beralih ke kamera lokal display...");
                isUsingControlStream = false;
                startDisplayDirectCamera();
            }
        }, 1200);
    }

    // DATABASE INDEXEDDB
    const DB_NAME = "TikTokStudioStorageDB";
    const STORE_NAME = "permanent_assets";

    function openDB() {
        return new Promise((resolve) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
        });
    }

    async function getSavedVideo(id) {
        try {
            const db = await openDB();
            if (!db) return null;
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get(`video_${id}`);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        } catch(e) { return null; }
    }

    function updateSlotDisplay(data) {
        const { slotNum, nameInput, initialPoin, profileImg, action } = data;
        const slotBox = document.getElementById(`slot-${slotNum}`);
        const coinBadge = document.getElementById(`coin-badge-${slotNum}`);
        const coincountElem = document.getElementById(`coincount-slot-${slotNum}`);
        const namePill = document.getElementById(`namepill-slot-${slotNum}`);
        const nameText = document.getElementById(`nametext-slot-${slotNum}`);
        const micContainer = document.getElementById(`mic-slot-${slotNum}`);
        const imgElem = document.getElementById(`img-slot-${slotNum}`);
        const bgElem = document.getElementById(`bg-slot-${slotNum}`);
        const bgOverlay = document.getElementById(`overlay-slot-${slotNum}`);
        const iconElem = document.getElementById(`icon-${slotNum}`);
        const reqElem = document.getElementById(`req-${slotNum}`);
        const topBadge = document.getElementById(`topbadge-slot-${slotNum}`);

        if (action === 'clear_slot') {
            imgElem.style.display = 'none';
            imgElem.removeAttribute('src');
            if (bgElem) { bgElem.style.display = 'none'; bgElem.removeAttribute('src'); }
            if (bgOverlay) bgOverlay.style.display = 'none';
            if (slotBox) slotBox.style.background = '#202127';

            iconElem.style.display = 'inline-block';
            reqElem.style.display = 'inline-block';
            namePill.style.display = 'none';
            micContainer.style.display = 'none';
            coinBadge.style.display = 'none';
            if (topBadge) { 
                topBadge.style.display = 'none'; 
                topBadge.removeAttribute('src'); 
            }
            if (badgeTimers[slotNum]) clearTimeout(badgeTimers[slotNum]);
            slotPoints[slotNum] = 0;
            return;
        }

        if (initialPoin !== undefined) slotPoints[slotNum] = initialPoin;
        if (coincountElem) {
            coincountElem.innerText = formatPoin(slotPoints[slotNum]);
            coinBadge.style.display = 'flex';
        }

        if (nameInput) {
            nameText.innerText = nameInput;
            namePill.style.display = 'flex';
            micContainer.style.display = 'flex';
        }

        if (profileImg) {
            iconElem.style.display = 'none';
            reqElem.style.display = 'none';
            imgElem.src = profileImg;
            imgElem.style.display = 'block';
            if (bgElem) { bgElem.src = profileImg; bgElem.style.display = 'block'; }
            if (bgOverlay) bgOverlay.style.display = 'block';
        }
    }

    function showGiftBadgeTemporarily(slotNum, badgeSrc) {
        if (!badgeSrc || !slotNum) return;
        const topBadge = document.getElementById(`topbadge-slot-${slotNum}`);
        if (!topBadge) return;

        if (badgeTimers[slotNum]) {
            clearTimeout(badgeTimers[slotNum]);
        }

        topBadge.src = badgeSrc;
        topBadge.style.display = 'block';

        badgeTimers[slotNum] = setTimeout(() => {
            topBadge.style.display = 'none';
            topBadge.removeAttribute('src');
        }, 5000);
    }

    channel.onmessage = async (event) => {
        const data = event.data;

        if (data.type === 'UPDATE_SLOT') {
            updateSlotDisplay(data);
        }
        else if (data.type === 'PLAY_GIFT') {
            const targetSlot = data.targetSlot;
            
            if (targetSlot && slotPoints[targetSlot] !== undefined) {
                slotPoints[targetSlot] += (data.increment || 0);
                const countElem = document.getElementById(`coincount-slot-${targetSlot}`);
                if (countElem) countElem.innerText = formatPoin(slotPoints[targetSlot]);
                const badge = document.getElementById(`coin-badge-${targetSlot}`);
                if (badge) badge.style.display = 'flex';
            }

            if (data.badgeImg) {
                showGiftBadgeTemporarily(targetSlot, data.badgeImg);
            }

            let videoUrl = null;
            if (data.videoBlob) {
                videoUrl = URL.createObjectURL(data.videoBlob);
            } else if (data.giftId) {
                const blob = await getSavedVideo(data.giftId);
                if (blob) videoUrl = URL.createObjectURL(blob);
            } else if (data.src) {
                videoUrl = data.src;
            }

            if (videoUrl) {
                playGiftVideo(videoUrl);
            }
        }
        else if (data.type === 'HOST_CAM_FRAME') {
            feedWatchdog();
            
            const camImg = document.getElementById('hostCameraImg');
            document.getElementById('hostPlaceholder').style.display = 'none';
            camImg.src = data.frame;
            camImg.style.display = 'block';

            const hVid = document.getElementById('hostVideo');
            if (hVid.style.display !== 'none') {
                hVid.style.display = 'none';
            }
        }
        else if (data.type === 'HOST_CAM_STOP') {
            isUsingControlStream = false;
            if (controlWatchdogTimer) clearTimeout(controlWatchdogTimer);
            startDisplayDirectCamera();
        }
        else if (data.type === 'CONTROL_CLOSED') {
            isUsingControlStream = false;
            if (controlWatchdogTimer) clearTimeout(controlWatchdogTimer);
            startDisplayDirectCamera();
        }
    };

    function formatPoin(val) {
        if (!val || val === 0) return '0';
        if (val >= 1000000) return (val / 1000000).toFixed(1).replace('.', ',') + 'M';
        if (val >= 1000) return (val / 1000).toFixed(1).replace('.', ',') + 'K';
        return val.toLocaleString('id-ID');
    }

    // PEMUTAR VIDEO DI DEPAN KOTAK DENGAN GREEN SCREEN & BLACK SCREEN TRANSPARAN OTOMATIS
    function playGiftVideo(src) {
        const overlayContainer = document.getElementById('giftOverlayContainer');
        const giftVideo = document.getElementById('giftVideo');
        const canvas = document.getElementById('giftCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        if (animFrameId) cancelAnimationFrame(animFrameId);

        overlayContainer.style.display = 'block';
        giftVideo.src = src;
        giftVideo.currentTime = 0;
        giftVideo.muted = false;
        giftVideo.volume = 1.0;

        giftVideo.onloadedmetadata = () => {
            canvas.width = Math.min(540, giftVideo.videoWidth || 540);
            canvas.height = Math.round(canvas.width * (giftVideo.videoHeight / giftVideo.videoWidth)) || 960;

            function renderFrame() {
                if (giftVideo.paused || giftVideo.ended) {
                    overlayContainer.style.display = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }

                ctx.drawImage(giftVideo, 0, 0, canvas.width, canvas.height);
                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = frame.data;
                const len = d.length;

                for (let i = 0; i < len; i += 4) {
                    const r = d[i], g = d[i + 1], b = d[i + 2];

                    // SISTEM PENGHAPUS GREEN SCREEN OTOMATIS DENGAN DESPILL HALUS
                    const maxRB = r > b ? r : b;
                    const greenDiff = g - maxRB;
                    if (greenDiff > 14 && g > 45) {
                        const alpha = greenDiff > 38 ? 0 : (1 - (greenDiff - 14) / 24);
                        d[i + 3] = (alpha * 255) | 0;
                        d[i + 1] = maxRB; // Menghilangkan pantulan hijau di pinggir gift
                        continue;
                    }

                    // Background hitam otomatis transparan
                    const lum = (r * 77 + g * 150 + b * 29) >> 8;
                    if (lum <= 18) {
                        d[i + 3] = 0;
                    } else if (lum < 42) {
                        const alpha = (lum - 18) / 24;
                        d[i + 3] = (alpha * 255) | 0;
                    }
                }

                ctx.putImageData(frame, 0, 0);
                animFrameId = requestAnimationFrame(renderFrame);
            }

            giftVideo.play().then(() => {
                renderFrame();
            }).catch(() => {
                giftVideo.muted = true;
                giftVideo.play().then(() => { renderFrame(); }).catch(() => { overlayContainer.style.display = 'none'; });
            });
        };

        giftVideo.onended = () => {
            overlayContainer.style.display = 'none';
            if (animFrameId) cancelAnimationFrame(animFrameId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            giftVideo.src = '';
        };
    }
</script>
</body>
</html>
