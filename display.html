<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Live Display Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
}

.phone-screen {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

.live-layout {
    width: 100%;
    max-width: 900px;
    height: min(43vh, 680px);
    min-height: 240px;
    display: flex;
    gap: 5px;
    align-items: stretch;
}

/* ================= HOST ================= */

.host-box {
    width: 50%;
    min-width: 0;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: #17191d;
    border: 3px solid #20eaff;
    border-radius: 17px;
    box-shadow: 0 0 8px rgba(0,220,255,.35);
    flex-shrink: 0;
    isolation: isolate;
}

#hostVideo,
#hostCameraImg {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    object-fit: cover;
    display: none;
    z-index: 1;
}

.host-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #777;
    font-size: 13px;
}

/* Label HOST di atas */

.host-top-pill {
    position: absolute;
    top: 9px;
    left: 9px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(235,242,248,.95);
    color: #263344;
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 2px 6px #0005;
}

.host-top-pill svg {
    width: 15px;
    height: 15px;
}

/* Nama host di bawah */

.host-name-label {
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 6;
    padding: 4px 8px;
    border-radius: 5px;
    background: rgba(0,0,0,.38);
    color: white;
    font-size: 14px;
    font-weight: 800;
    text-shadow: 0 1px 4px #000;
    max-width: 90%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* ================= GRID PESERTA ================= */

.komal-grid {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    grid-template-rows: repeat(4,minmax(0,1fr));
    gap: 5px;
}

.slot-box {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #11191c;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    isolation: isolate;
}

.slot-bg-blur {
    position: absolute;
    inset: -5px;
    width: calc(100% + 10px);
    height: calc(100% + 10px);
    object-fit: cover;
    filter: blur(8px) brightness(.65);
    display: none;
    z-index: -1;
}

.slot-bg-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.25);
    display: none;
    z-index: 0;
}

/* Foto profil bulat */

.slot-circle-img {
    position: absolute;
    width: min(49%, 78px);
    aspect-ratio: 1;
    height: auto;
    border-radius: 50%;
    object-fit: cover;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    z-index: 2;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 2px 10px #0008;
    display: none;
}

/* Poin dan bintang */

.slot-coin-badge {
    position: absolute;
    top: 5px;
    left: 5px;
    z-index: 5;
    display: none;
    align-items: center;
    gap: 5px;
    padding: 3px 9px 3px 4px;
    border-radius: 20px;
    background: rgba(0,0,0,.85);
    border: 1px solid rgba(255,255,255,.12);
}

.cyan-diamond-circle {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: radial-gradient(circle,#fff 5%,#58eaff 40%,#078bff 85%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 5px #00cfff;
    flex-shrink: 0;
}

.star-svg {
    width: 10px;
    height: 10px;
    fill: white;
}

.coin-count {
    color: white;
    font-size: 11px;
    font-weight: 900;
    white-space: nowrap;
}

/* Nama peserta */

.slot-name-pill {
    position: absolute;
    bottom: 5px;
    left: 5px;
    z-index: 6;
    max-width: calc(100% - 34px);
    min-height: 25px;
    display: none;
    align-items: center;
    gap: 4px;
    padding: 3px 5px 3px 8px;
    border-radius: 7px;
    background: rgba(0,0,0,.88);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 2px 5px #0006;
}

.slot-name-text {
    color: #fff;
    font-size: clamp(9px,1.2vw,13px);
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90px;
}

/* Plus bulat */

.slot-plus-circle {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.27);
    border: 1px solid rgba(255,255,255,.3);
}

.slot-plus-circle svg {
    width: 11px;
    height: 11px;
}

/* Mikrofon mute */

.mic-container {
    position: absolute;
    right: 5px;
    bottom: 5px;
    z-index: 7;
    width: 24px;
    height: 24px;
    display: none;
    justify-content: center;
    align-items: center;
    border-radius: 6px;
    background: rgba(0,0,0,.9);
    border: 1px solid rgba(255,255,255,.15);
}

.mic-container svg {
    width: 15px;
    height: 15px;
}

/* Badge gift */

.slot-top-badge {
    position: absolute;
    right: 5px;
    top: 5px;
    width: 29px;
    height: 29px;
    object-fit: contain;
    display: none;
    z-index: 8;
    filter: drop-shadow(0 2px 3px #000);
}

/* Kotak kosong */

.slot-plus-svg {
    width: 32px;
    height: 32px;
    stroke: #dce3e7;
    stroke-width: 2.5;
    z-index: 2;
}

.slot-req {
    position: absolute;
    top: 66%;
    color: #dce3e7;
    font-size: clamp(9px,1.2vw,13px);
    font-weight: 700;
    z-index: 2;
}

/* ================= JUDUL ================= */

.display-title {
    position: absolute;
    top: calc(50% - min(43vh,680px) / 2 - 38px);
    right: max(12px, calc((100% - 900px) / 2 + 12px));
    font-size: clamp(13px,2.5vw,25px);
    font-weight: 500;
    color: white;
    text-align: right;
    letter-spacing: .5px;
}

/* ================= GIFT NOTIFICATION ================= */

.gift-banner-wrapper {
    position: absolute;
    bottom: 43px;
    left: 7px;
    z-index: 20;
    pointer-events: none;
    max-width: 90%;
}

.gift-banner-toast {
    display: none;
    align-items: center;
    padding: 4px 8px 4px 4px;
    border-radius: 30px;
    background: rgba(15,16,23,.91);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 2px 8px #0008;
    max-width: 100%;
}

.toast-avatar {
    width: 29px;
    height: 29px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.toast-text-col {
    margin: 0 7px;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.toast-name {
    color: white;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}

.toast-desc {
    color: #ccc;
    font-size: 9px;
    white-space: nowrap;
}

.toast-gift-img {
    width: 34px;
    height: 34px;
    object-fit: contain;
}

.toast-combo-count {
    display: none;
    margin-left: 5px;
    font-size: 17px;
    font-weight: 900;
    font-style: italic;
    text-shadow: 0 2px 4px #000;
}

@keyframes slideIn {
    from { transform: translateX(-110%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

@keyframes slideOut {
    to { transform: translateX(-110%); opacity: 0; }
}

/* ================= GIFT VIDEO ================= */

.gift-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    display: none;
}

#giftCanvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#giftVideo {
    display: none;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 600px) {

    .phone-screen {
        padding: 5px;
    }

    .live-layout {
        height: min(43vh,520px);
        gap: 4px;
    }

    .host-box {
        width: 50%;
        border-radius: 12px;
        border-width: 2px;
    }

    .komal-grid {
        gap: 4px;
    }

    .slot-box {
        border-radius: 9px;
    }

    .slot-name-pill {
        bottom: 4px;
        left: 3px;
        min-height: 20px;
        padding: 2px 3px 2px 5px;
        gap: 3px;
    }

    .slot-name-text {
        max-width: 62px;
        font-size: 9px;
    }

    .slot-plus-circle {
        width: 15px;
        height: 15px;
    }

    .slot-plus-circle svg {
        width: 9px;
        height: 9px;
    }

    .mic-container {
        width: 20px;
        height: 20px;
        right: 3px;
        bottom: 4px;
    }

    .mic-container svg {
        width: 12px;
        height: 12px;
    }

    .slot-coin-badge {
        top: 3px;
        left: 3px;
        padding: 2px 5px 2px 3px;
        gap: 3px;
    }

    .cyan-diamond-circle {
        width: 14px;
        height: 14px;
    }

    .coin-count {
        font-size: 9px;
    }

    .host-name-label {
        font-size: 12px;
        bottom: 7px;
        left: 6px;
    }

    .host-top-pill {
        top: 6px;
        left: 6px;
        font-size: 10px;
        padding: 3px 7px;
    }

    .display-title {
        top: calc(50% - min(43vh,520px) / 2 - 27px);
    }
}

</style>
</head>

<body>

<div class="phone-screen" id="displayContainer">

    <div class="display-title">SUPPORT TEP SH3RE</div>

    <div class="live-layout">

        <!-- HOST -->
        <div class="host-box" id="hostBox">

            <div class="host-top-pill">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 12a7 7 0 0 1-5.6-2.8 6.5 6.5 0 0 1 11.2 0A7 7 0 0 1 12 18z"/>
                </svg>
                <span>Host</span>
            </div>

            <div class="host-placeholder" id="hostPlaceholder">
                Kamera Host
            </div>

            <video id="hostVideo" autoplay playsinline muted></video>

            <img id="hostCameraImg" alt="Host">

            <div class="host-name-label" id="hostNameLabel">
                Host
            </div>

            <div class="gift-banner-wrapper">
                <div class="gift-banner-toast" id="giftBannerToast">

                    <img class="toast-avatar" id="toastGifterAvatar" src="" alt="">

                    <div class="toast-text-col">
                        <div class="toast-name" id="toastGifterName">Host</div>
                        <div class="toast-desc" id="toastGiftDesc">Gift</div>
                    </div>

                    <img class="toast-gift-img" id="toastGiftIcon" src="" alt="">

                </div>

                <span class="toast-combo-count" id="toastComboCount">x 1</span>
            </div>

        </div>

        <!-- PESERTA -->
        <div class="komal-grid" id="komalGrid"></div>

    </div>

    <!-- GIFT VIDEO OVERLAY -->
    <div class="gift-overlay" id="giftOverlayContainer">
        <video id="giftVideo" playsinline crossorigin="anonymous"></video>
        <canvas id="giftCanvas"></canvas>
    </div>

</div>

<script>
'use strict';

/* ==========================================
   PENGATURAN DASAR
========================================== */

const channel = new BroadcastChannel('tiktok_live_channel');

const $ = id => document.getElementById(id);

const slotPoints = {};
const badgeTimers = {};

let detectedHostName = 'Host';
let detectedHostAvatar = '';

let displayCamStream = null;
let cameraStarting = false;

let toastTimer = null;
let toastHideTimer = null;

const giftComboGroups = new Map();
const giftVideoQueue = [];

let giftVideoQueueBusy = false;

/* ==========================================
   MEMBUAT 8 KOTAK PESERTA
========================================== */

const grid = $('komalGrid');

for (let i = 1; i <= 8; i++) {

    slotPoints[i] = 0;

    grid.insertAdjacentHTML('beforeend', `

        <div class="slot-box" id="slot-${i}">

            <img class="slot-bg-blur"
                 id="bg-slot-${i}">

            <div class="slot-bg-overlay"
                 id="overlay-slot-${i}"></div>

            <div class="slot-coin-badge"
                 id="coin-badge-${i}">

                <div class="cyan-diamond-circle">

                    <svg class="star-svg" viewBox="0 0 24 24">
                        <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
                    </svg>

                </div>

                <span class="coin-count"
                      id="coincount-slot-${i}">0</span>

            </div>

            <img class="slot-top-badge"
                 id="topbadge-slot-${i}"
                 alt="Gift">

            <svg class="slot-plus-svg"
                 id="icon-${i}"
                 viewBox="0 0 24 24"
                 fill="none">

                <path d="M12 4V20M4 12H20"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"/>

            </svg>

            <span class="slot-req" id="req-${i}">
                Permintaan
            </span>

            <img class="slot-circle-img"
                 id="img-slot-${i}"
                 alt="Peserta">

            <div class="slot-name-pill"
                 id="namepill-slot-${i}">

                <span class="slot-name-text"
                      id="nametext-slot-${i}">Peserta</span>

                <div class="slot-plus-circle">

                    <svg viewBox="0 0 16 16">
                        <path d="M8 2V14M2 8H14"
                              stroke="white"
                              stroke-width="2"
                              stroke-linecap="round"/>
                    </svg>

                </div>

            </div>

            <div class="mic-container"
                 id="mic-slot-${i}">

                <svg viewBox="0 0 24 24" fill="none">

                    <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"
                          fill="white"/>

                    <path d="M19 10v1a7 7 0 0 1-14 0v-1h2v1a5 5 0 0 0 10 0v-1h2Z"
                          fill="white"/>

                    <path d="M4 4L20 20"
                          stroke="white"
                          stroke-width="2.5"
                          stroke-linecap="round"/>

                </svg>

            </div>

        </div>

    `);
}

/* ==========================================
   FORMAT POIN
========================================== */

function formatPoin(value) {

    value = Number(value) || 0;

    if (value >= 1000000) {
        return (value / 1000000).toFixed(1).replace('.', ',') + 'M';
    }

    if (value >= 1000) {
        return (value / 1000).toFixed(1).replace('.', ',') + 'K';
    }

    return value.toLocaleString('id-ID');
}

/* ==========================================
   UPDATE NAMA HOST
   KOMPATIBEL CONTROL LAMA
========================================== */

function updateHostName(data) {

    const name =
        data.hostName ||
        data.name ||
        data.nickname ||
        data.username;

    if (name) {

        detectedHostName = String(name);

        $('hostNameLabel').textContent = detectedHostName;
    }

    if (data.hostAvatar) {
        detectedHostAvatar = data.hostAvatar;
    }

    if (data.avatar) {
        detectedHostAvatar = data.avatar;
    }
}

/* ==========================================
   UPDATE SLOT PESERTA
========================================== */

function updateSlotDisplay(data) {

    const slotNum = Number(data.slotNum);

    if (!slotNum || slotNum < 1 || slotNum > 8) return;

    const img = $(`img-slot-${slotNum}`);
    const bg = $(`bg-slot-${slotNum}`);

    const overlay = $(`overlay-slot-${slotNum}`);

    const coin = $(`coin-badge-${slotNum}`);
    const count = $(`coincount-slot-${slotNum}`);

    const namePill = $(`namepill-slot-${slotNum}`);
    const nameText = $(`nametext-slot-${slotNum}`);

    const mic = $(`mic-slot-${slotNum}`);

    const icon = $(`icon-${slotNum}`);
    const req = $(`req-${slotNum}`);

    const topBadge = $(`topbadge-slot-${slotNum}`);

    if (
        data.action === 'clear_slot' ||
        data.action === 'clear'
    ) {

        img.style.display = 'none';
        img.removeAttribute('src');

        bg.style.display = 'none';
        bg.removeAttribute('src');

        overlay.style.display = 'none';

        icon.style.display = 'block';
        req.style.display = 'block';

        coin.style.display = 'none';

        namePill.style.display = 'none';
        mic.style.display = 'none';

        topBadge.style.display = 'none';
        topBadge.removeAttribute('src');

        slotPoints[slotNum] = 0;

        clearTimeout(badgeTimers[slotNum]);

        return;
    }

    if (data.initialPoin !== undefined) {

        slotPoints[slotNum] =
            Number(data.initialPoin) || 0;
    }

    if (data.nameInput !== undefined) {

        nameText.textContent = data.nameInput;

        namePill.style.display = 'flex';
        mic.style.display = 'flex';
    }

    if (data.profileImg) {

        img.src = data.profileImg;
        img.style.display = 'block';

        bg.src = data.profileImg;
        bg.style.display = 'block';

        overlay.style.display = 'block';

        icon.style.display = 'none';
        req.style.display = 'none';
    }

    count.textContent = formatPoin(slotPoints[slotNum]);

    coin.style.display = 'flex';
}

/* ==========================================
   GIFT BADGE DI KOTAK PESERTA
========================================== */

function showGiftBadgeTemporarily(slotNum, src) {

    if (!slotNum || !src) return;

    const badge = $(`topbadge-slot-${slotNum}`);

    if (!badge) return;

    clearTimeout(badgeTimers[slotNum]);

    badge.src = src;
    badge.style.display = 'block';

    badgeTimers[slotNum] = setTimeout(() => {

        badge.style.display = 'none';
        badge.removeAttribute('src');

    }, 5000);
}

/* ==========================================
   NOTIFIKASI GIFT
========================================== */

function showGiftToast(data, comboCount = 1) {

    const toast = $('giftBannerToast');

    const avatar = $('toastGifterAvatar');
    const name = $('toastGifterName');
    const desc = $('toastGiftDesc');
    const giftIcon = $('toastGiftIcon');

    const combo = $('toastComboCount');

    avatar.src =
        data.senderAvatar ||
        detectedHostAvatar ||
        '';

    name.textContent =
        data.senderName ||
        data.username ||
        'User';

    desc.textContent =
        data.giftTitle ||
        'Gift';

    if (data.badgeImg) {

        giftIcon.src = data.badgeImg;
        giftIcon.style.display = 'block';

    } else {

        giftIcon.style.display = 'none';
    }

    combo.textContent = 'x ' + comboCount;
    combo.style.display = 'inline-block';

    clearTimeout(toastTimer);
    clearTimeout(toastHideTimer);

    toast.style.display = 'flex';
    toast.style.animation = 'slideIn .35s ease forwards';

    toastTimer = setTimeout(() => {

        toast.style.animation = 'slideOut .3s ease forwards';

        toastHideTimer = setTimeout(() => {

            toast.style.display = 'none';
            combo.style.display = 'none';

        }, 300);

    }, 3000);
}

/* ==========================================
   INDEXEDDB GIFT VIDEO
========================================== */

const DB_NAME = 'TikTokStudioStorageDB';
const STORE_NAME = 'permanent_assets';

let dbPromise = null;

function openDB() {

    if (dbPromise) return dbPromise;

    dbPromise = new Promise(resolve => {

        const request = indexedDB.open(DB_NAME, 1);

        request.onsuccess = () => resolve(request.result);

        request.onerror = () => {
            dbPromise = null;
            resolve(null);
        };
    });

    return dbPromise;
}

async function getSavedVideo(id) {

    try {

        const db = await openDB();

        if (!db) return null;

        return await new Promise(resolve => {

            const tx = db.transaction(STORE_NAME, 'readonly');

            const request =
                tx.objectStore(STORE_NAME).get(`video_${id}`);

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => resolve(null);

        });

    } catch (error) {

        return null;
    }
}

/* ==========================================
   SISTEM COMBO GIFT
========================================== */

function getComboKey(data) {

    const sender =
        String(data.senderName || data.username || 'user')
        .toLowerCase();

    const gift =
        String(data.giftId || data.giftTitle || 'gift')
        .toLowerCase();

    return sender + '::' + gift;
}

async function resolveGiftVideo(data) {

    if (data.videoBlob) {

        return URL.createObjectURL(data.videoBlob);
    }

    if (data.giftId) {

        const blob = await getSavedVideo(data.giftId);

        if (blob) {
            return URL.createObjectURL(blob);
        }
    }

    return data.src || null;
}

function receiveGiftForCombo(data) {

    const key = getComboKey(data);

    let group = giftComboGroups.get(key);

    if (!group) {

        group = {
            data: {...data},
            count: 0,
            src: null,
            timer: null,
            revision: 0,
            promise: Promise.resolve()
        };

        giftComboGroups.set(key, group);
    }

    group.data = {...group.data, ...data};

    group.revision++;

    const cumulative = Number(
        data.repeatCount ??
        data.repeat_count ??
        data.comboCount ??
        data.combo_count
    );

    if (Number.isFinite(cumulative) && cumulative > 0) {

        group.count = Math.max(
            group.count,
            Math.floor(cumulative)
        );

    } else {

        group.count += Math.max(
            1,
            Number(data.giftCount) || 1
        );
    }

    showGiftToast(group.data, group.count);

    group.promise = group.promise.then(async () => {

        const src = await resolveGiftVideo(data);

        if (src) {

            if (group.src && group.src.startsWith('blob:')) {
                URL.revokeObjectURL(group.src);
            }

            group.src = src;
        }

    }).catch(console.error);

    clearTimeout(group.timer);

    const end =
        data.repeatEnd === true ||
        data.repeat_end === true ||
        data.comboEnd === true ||
        data.combo_end === true;

    const revision = group.revision;

    group.timer = setTimeout(async () => {

        await group.promise;

        if (
            giftComboGroups.get(key) !== group ||
            group.revision !== revision
        ) {
            return;
        }

        giftComboGroups.delete(key);

        if (group.src) {

            queueGiftVideo(group.src, group.count);
        }

    }, end ? 0 : 900);
}

/* ==========================================
   PESAN MASUK BROADCAST
========================================== */

function handleIncomingMessage(data) {

    if (!data) return;

    switch (data.type) {

        case 'UPDATE_HOST':
        case 'UPDATE_HOST_NAME':
        case 'UPDATE_HOST_LABEL':

            updateHostName(data);

            break;

        case 'UPDATE_SLOT':

            updateSlotDisplay(data);

            break;

        case 'PLAY_GIFT': {

            const targetSlot = Number(data.targetSlot);

            if (
                targetSlot >= 1 &&
                targetSlot <= 8
            ) {

                slotPoints[targetSlot] +=
                    Number(data.increment) || 0;

                $(`coincount-slot-${targetSlot}`)
                    .textContent = formatPoin(slotPoints[targetSlot]);

                $(`coin-badge-${targetSlot}`)
                    .style.display = 'flex';
            }

            if (data.badgeImg && targetSlot) {

                showGiftBadgeTemporarily(
                    targetSlot,
                    data.badgeImg
                );
            }

            receiveGiftForCombo(data);

            break;
        }

        case 'RESET_HOST_MEDIA':

            stopHostCamera();

            break;

        case 'TRIGGER_DISPLAY_CAMERA':

            if (data.action === 'start') {
                startHostCamera();
            }

            if (data.action === 'stop') {
                stopHostCamera();
            }

            break;

        case 'SET_HOST_VIDEO':

            if (data.videoBlob) {

                stopHostCamera();

                const video = $('hostVideo');

                video.srcObject = null;
                video.src = URL.createObjectURL(data.videoBlob);

                video.style.display = 'block';

                $('hostPlaceholder').style.display = 'none';

                video.play().catch(() => {});
            }

            break;
    }
}

channel.onmessage = event => {

    handleIncomingMessage(event.data);
};

/* ==========================================
   WEBSOCKET TIKTOK
========================================== */

let ws = null;
let reconnectTimer = null;
let reconnectDelay = 1000;
let manuallyClosed = false;

function connectWebSocket() {

    if (manuallyClosed) return;

    if (
        ws &&
        (
            ws.readyState === WebSocket.OPEN ||
            ws.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    try {

        const protocol =
            location.protocol === 'https:' ? 'wss:' : 'ws:';

        const socketUrl =
            `${protocol}//${location.host || 'localhost:8081'}`;

        ws = new WebSocket(socketUrl);

        ws.onopen = () => {

            console.log('TikTok WebSocket terhubung.');

            reconnectDelay = 1000;
        };

        ws.onmessage = event => {

            try {

                const d = JSON.parse(event.data);

                if (d.type === 'gift') {

                    handleIncomingMessage({

                        type: 'PLAY_GIFT',

                        targetSlot: Number(d.targetSlot) || 1,

                        increment: Number(d.coins) || 1,

                        badgeImg: d.giftImage || '',

                        giftTitle: d.giftName || 'Gift',

                        senderName:
                            d.nickname ||
                            d.username ||
                            'User',

                        senderAvatar: d.avatar || '',

                        giftId:
                            d.giftId ||
                            d.gift_id ||
                            d.id ||
                            '',

                        repeatCount:
                            d.repeatCount ??
                            d.repeat_count ??
                            d.comboCount ??
                            d.combo_count,

                        giftCount:
                            d.giftCount ??
                            d.gift_count,

                        repeatEnd:
                            d.repeatEnd ??
                            d.repeat_end ??
                            d.comboEnd ??
                            d.combo_end,

                        videoBlob: d.videoBlob,

                        src:
                            d.src ||
                            d.videoUrl ||
                            d.video_url ||
                            ''
                    });
                }

            } catch (error) {

                console.error('Pesan WebSocket tidak valid:', error);
            }
        };

        ws.onerror = error => {

            console.log('WebSocket error:', error);
        };

        ws.onclose = () => {

            ws = null;

            if (manuallyClosed) return;

            clearTimeout(reconnectTimer);

            reconnectTimer = setTimeout(
                connectWebSocket,
                reconnectDelay
            );

            reconnectDelay = Math.min(
                reconnectDelay * 1.5,
                10000
            );
        };

    } catch (error) {

        console.error(error);

        reconnectTimer = setTimeout(
            connectWebSocket,
            reconnectDelay
        );
    }
}

connectWebSocket();

/* ==========================================
   KAMERA HOST
========================================== */

async function startHostCamera() {

    if (cameraStarting) return;

    const video = $('hostVideo');

    try {

        if (
            displayCamStream &&
            displayCamStream.getVideoTracks().some(
                track => track.readyState === 'live'
            )
        ) {

            video.srcObject = displayCamStream;
            video.style.display = 'block';

            $('hostPlaceholder').style.display = 'none';

            await video.play().catch(() => {});

            return;
        }

        if (!navigator.mediaDevices?.getUserMedia) {

            throw new Error('Gunakan HTTPS atau localhost.');
        }

        cameraStarting = true;

        displayCamStream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    width: {ideal: 720},
                    height: {ideal: 1280},

                    frameRate: {
                        ideal: 30,
                        max: 30
                    },

                    facingMode: 'user'
                }
            });

        video.srcObject = displayCamStream;

        video.style.display = 'block';

        $('hostPlaceholder').style.display = 'none';

        await video.play();

    } catch (error) {

        console.error('Kamera:', error);

        $('hostPlaceholder').textContent =
            'Kamera tidak tersedia';

    } finally {

        cameraStarting = false;
    }
}

function stopHostCamera() {

    if (displayCamStream) {

        displayCamStream.getTracks().forEach(
            track => track.stop()
        );

        displayCamStream = null;
    }

    const video = $('hostVideo');

    video.pause();
    video.srcObject = null;
    video.style.display = 'none';

    $('hostPlaceholder').style.display = 'flex';
}

/* ==========================================
   SISTEM VIDEO GIFT
========================================== */

const giftVideo = $('giftVideo');
const giftCanvas = $('giftCanvas');
const giftOverlay = $('giftOverlayContainer');

let canvasContext = null;
let renderFrame = null;
let renderActive = false;

function stopGiftRenderer() {

    renderActive = false;

    if (renderFrame !== null) {

        cancelAnimationFrame(renderFrame);

        renderFrame = null;
    }
}

function renderGiftFrame() {

    if (!renderActive) return;

    if (
        giftVideo.readyState >= giftVideo.HAVE_CURRENT_DATA &&
        !giftVideo.paused
    ) {

        if (canvasContext) {

            canvasContext.clearRect(
                0,
                0,
                giftCanvas.width,
                giftCanvas.height
            );

            canvasContext.drawImage(
                giftVideo,
                0,
                0,
                giftCanvas.width,
                giftCanvas.height
            );
        }
    }

    renderFrame = requestAnimationFrame(renderGiftFrame);
}

function playGiftVideo(src, callback) {

    const video = giftVideo;

    let finished = false;

    stopGiftRenderer();

    function finish() {

        if (finished) return;

        finished = true;

        stopGiftRenderer();

        giftOverlay.style.display = 'none';

        video.pause();

        video.onended = null;
        video.onerror = null;

        video.removeAttribute('src');
        video.load();

        if (canvasContext) {

            canvasContext.clearRect(
                0,
                0,
                giftCanvas.width,
                giftCanvas.height
            );
        }

        if (callback) callback();
    }

    giftOverlay.style.display = 'block';

    video.pause();

    video.removeAttribute('src');

    video.src = src;

    video.muted = false;
    video.volume = 1;

    video.onended = finish;
    video.onerror = finish;

    video.onloadedmetadata = async () => {

        const width = video.videoWidth || 720;
        const height = video.videoHeight || 1280;

        const scale = Math.min(
            1,
            720 / width,
            1280 / height
        );

        giftCanvas.width = Math.round(width * scale);
        giftCanvas.height = Math.round(height * scale);

        canvasContext = giftCanvas.getContext('2d', {
            alpha: true
        });

        try {

            await video.play();

            renderActive = true;

            renderGiftFrame();

        } catch (error) {

            console.error('Gift video gagal diputar:', error);

            video.muted = true;

            try {

                await video.play();

                renderActive = true;

                renderGiftFrame();

            } catch (e) {

                finish();
            }
        }
    };

    video.load();
}

/* ==========================================
   ANTRIAN GIFT
========================================== */

function queueGiftVideo(src, count = 1) {

    if (!src) return;

    giftVideoQueue.push({

        src,

        remaining: Math.max(
            1,
            Math.min(999, Number(count) || 1)
        ),

        isBlob: src.startsWith('blob:')
    });

    playNextGiftVideo();
}

function playNextGiftVideo() {

    if (
        giftVideoQueueBusy ||
        giftVideoQueue.length === 0
    ) {
        return;
    }

    giftVideoQueueBusy = true;

    const item = giftVideoQueue[0];

    playGiftVideo(item.src, () => {

        item.remaining--;

        if (item.remaining > 0) {

            giftVideoQueueBusy = false;

            playNextGiftVideo();

        } else {

            giftVideoQueue.shift();

            if (item.isBlob) {

                URL.revokeObjectURL(item.src);
            }

            giftVideoQueueBusy = false;

            playNextGiftVideo();
        }
    });
}

/* ==========================================
   CLEANUP
========================================== */

window.addEventListener('pagehide', () => {

    manuallyClosed = true;

    stopHostCamera();

    stopGiftRenderer();

    clearTimeout(reconnectTimer);
    clearTimeout(toastTimer);
    clearTimeout(toastHideTimer);

    if (ws) {

        ws.close();

        ws = null;
    }

    for (const timer of Object.values(badgeTimers)) {

        clearTimeout(timer);
    }

    for (const group of giftComboGroups.values()) {

        clearTimeout(group.timer);

        if (group.src && group.src.startsWith('blob:')) {

            URL.revokeObjectURL(group.src);
        }
    }

    giftComboGroups.clear();

    giftVideoQueue.forEach(item => {

        if (item.isBlob) {

            URL.revokeObjectURL(item.src);
        }
    });

    giftVideoQueue.length = 0;

    channel.close();
});

console.log('TikTok Live Display siap digunakan.');
