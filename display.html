<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Live Display Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:Arial,sans-serif}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#08090d}
#hostBox{position:absolute;inset:0 0 auto 0;height:22%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#111827;border:2px solid #278cff;z-index:2}
#hostBox video,#hostBox img{width:100%;height:100%;object-fit:cover}
#hostBox video{display:none}
#hostPlaceholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
#hostPlaceholder img{width:65px;height:65px;border-radius:50%;object-fit:cover;border:2px solid #38bdf8}
#hostName{font-weight:bold;font-size:clamp(12px,2vw,22px)}
#hostTag{font-size:11px;color:#38bdf8}
#slots{position:absolute;left:0;right:0;top:22%;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:5px;padding:5px}
.slot{position:relative;min-width:0;min-height:0;overflow:hidden;background:#171c28;border:2px solid #344258;border-radius:10px;contain:layout paint}
.slot-bg{position:absolute;inset:0;background:linear-gradient(145deg,#202b40,#10131b)}
.slot-avatar{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38}
.slot-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.slot-avatar-main{width:clamp(35px,8vw,85px);height:clamp(35px,8vw,85px);border-radius:50%;border:2px solid #5caeff;object-fit:cover;background:#273449}
.slot-name{font-weight:bold;font-size:clamp(10px,1.5vw,17px);text-align:center;text-shadow:0 2px 5px #000;padding:0 4px;max-width:100%;overflow-wrap:anywhere}
.slot-points{font-size:clamp(9px,1vw,13px);color:#facc15;text-shadow:0 2px 5px #000}
.slot-number{position:absolute;top:5px;left:6px;background:#0009;border-radius:5px;padding:3px 6px;font-size:10px}
.slot.empty .slot-avatar-main{opacity:.4}
.slot.empty .slot-name{color:#8b97aa}
#giftNotice{position:absolute;z-index:20;top:5%;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;max-width:90%;padding:10px 18px;border:1px solid #f8c34b;border-radius:12px;background:#101018ed;box-shadow:0 5px 25px #0009}
#giftNotice img{width:42px;height:42px;object-fit:contain}
#giftNoticeText{font-size:clamp(11px,1.5vw,18px);font-weight:bold}
#giftOverlay{position:absolute;inset:0;z-index:30;display:none;pointer-events:none;background:transparent}
#giftCanvas{width:100%;height:100%;display:block;background:transparent}
#giftVideo{display:none}
#connectionStatus{position:absolute;right:8px;top:8px;z-index:40;color:#10b981;font-size:10px;background:#0009;padding:4px 7px;border-radius:5px}

/* LAYOUT */
#stage.layout-duo #hostBox{height:22%}
#stage.layout-duo #slots{top:22%;grid-template-columns:repeat(2,1fr);grid-template-rows:1fr}
#stage.layout-trio #hostBox{height:18%}
#stage.layout-trio #slots{top:18%;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}
#stage.layout-squad4 #slots{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
#stage.layout-squad5 #slots{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
#stage.layout-squad6 #slots{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
#stage.layout-squad7 #slots{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
#stage.layout-squad8 #slots{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}
#stage.layout-vertical #slots{grid-template-columns:1fr;grid-template-rows:repeat(8,1fr);overflow-y:auto}
#stage.layout-horizontal #slots{grid-template-columns:repeat(8,1fr);grid-template-rows:1fr}
#stage.layout-host_focus #hostBox{height:45%;left:0;right:35%;width:65%}
#stage.layout-host_focus #slots{top:0;left:65%;width:35%;grid-template-columns:1fr;grid-template-rows:repeat(8,1fr)}
#stage.layout-spotlight #slots{grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(3,1fr)}
#stage.layout-spotlight .slot:first-child{grid-row:span 2}
#stage.layout-two_big #slots{grid-template-columns:2fr 2fr 1fr 1fr;grid-template-rows:repeat(2,1fr)}
#stage.layout-two_big .slot:nth-child(-n+2){grid-row:span 2}
#stage.layout-asymmetric #slots{grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(3,1fr)}
#stage.layout-asymmetric .slot:first-child{grid-row:span 2}
#stage.layout-asymmetric .slot:nth-child(2){grid-column:2}
#stage.layout-asymmetric .slot:nth-child(3){grid-column:3}
@media(max-width:600px){
#stage.layout-squad7 #slots,#stage.layout-squad8 #slots{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="stage" class="layout-squad8">
 <div id="hostBox">
  <div id="hostPlaceholder">
   <img id="hostAvatar" src="https://p16-va-default.akamaized.net/tos-maliva-avt-0068/7334710890691510278~c5_100x100.jpeg" alt="">
   <div id="hostName">Host</div>
   <div id="hostTag">HOST STANDBY</div>
  </div>
  <video id="hostVideo" autoplay muted loop playsinline></video>
 </div>
 <div id="slots"></div>
 <div id="giftNotice">
  <img id="giftNoticeImg" src="" alt="">
  <div id="giftNoticeText"></div>
 </div>
 <div id="giftOverlay"><canvas id="giftCanvas"></canvas></div>
 <video id="giftVideo" playsinline muted></video>
 <div id="connectionStatus">DISPLAY READY</div>
</div>

<script>
'use strict';
const channel=new BroadcastChannel('tiktok_live_channel');
const stage=document.getElementById('stage');
const slotsEl=document.getElementById('slots');
const hostVideo=document.getElementById('hostVideo');
const hostPlaceholder=document.getElementById('hostPlaceholder');
const hostAvatar=document.getElementById('hostAvatar');
const hostName=document.getElementById('hostName');
const hostTag=document.getElementById('hostTag');
const giftVideo=document.getElementById('giftVideo');
const giftCanvas=document.getElementById('giftCanvas');
const giftOverlay=document.getElementById('giftOverlay');
const giftNotice=document.getElementById('giftNotice');
const giftNoticeImg=document.getElementById('giftNoticeImg');
const giftNoticeText=document.getElementById('giftNoticeText');

let layoutId=localStorage.getItem('komal_layout')||'squad8';
let hostStream=null;
let giftQueue=Promise.resolve();
let giftNoticeTimer=null;
const slotData={};
for(let i=1;i<=8;i++)slotData[i]={name:'Kotak '+i,username:'',avatar:'',points:0,active:false};

function makeSlot(i){
 const box=document.createElement('div');
 box.className='slot empty';
 box.dataset.slot=i;
 box.innerHTML=`
  <div class="slot-bg"></div>
  <img class="slot-avatar" alt="">
  <div class="slot-content">
   <img class="slot-avatar-main" alt="">
   <div class="slot-name">Kotak ${i}</div>
   <div class="slot-points">0 POIN</div>
  </div>
  <div class="slot-number">KOTAK ${i}</div>`;
 slotsEl.appendChild(box);
}
for(let i=1;i<=8;i++)makeSlot(i);

function renderSlot(i){
 const data=slotData[i],box=slotsEl.querySelector(`[data-slot="${i}"]`);
 if(!box)return;
 box.classList.toggle('empty',!data.active);
 const main=box.querySelector('.slot-avatar-main');
 const bg=box.querySelector('.slot-avatar');
 const name=box.querySelector('.slot-name');
 const points=box.querySelector('.slot-points');
 name.textContent=data.active?data.name:'Kotak '+i;
 points.textContent=(Number(data.points)||0).toLocaleString('id-ID')+' POIN';
 if(data.avatar){
  main.src=data.avatar;main.style.display='block';
  bg.src=data.avatar;bg.style.display='block';
 }else{
  main.removeAttribute('src');bg.removeAttribute('src');
  main.style.display='none';bg.style.display='none';
 }
}
function applyLayout(id){
 const allowed=['duo','trio','squad4','squad5','squad6','squad7','squad8','vertical','horizontal','host_focus','spotlight','two_big','asymmetric'];
 layoutId=allowed.includes(id)?id:'squad8';
 stage.className='layout-'+layoutId;
 localStorage.setItem('komal_layout',layoutId);
 document.getElementById('connectionStatus').textContent='LAYOUT: '+layoutId.toUpperCase();
}
function updateHost(name,avatar){
 hostName.textContent=name||'Host';
 if(avatar)hostAvatar.src=avatar;
 hostTag.textContent='HOST';
}
function stopHostVideo(){
 hostVideo.pause();hostVideo.removeAttribute('src');hostVideo.load();
 hostVideo.style.display='none';hostPlaceholder.style.display='flex';
}
function playHostBlob(blob){
 if(!blob)return;
 if(hostStream){URL.revokeObjectURL(hostStream);hostStream=null}
 hostStream=URL.createObjectURL(blob);
 hostVideo.src=hostStream;hostVideo.style.display='block';
 hostPlaceholder.style.display='none';
 hostVideo.play().catch(()=>{});
}
async function startCamera(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:false});
  if(hostStream){URL.revokeObjectURL(hostStream);hostStream=null}
  hostVideo.srcObject=stream;hostVideo.style.display='block';hostPlaceholder.style.display='none';
  hostVideo.loop=false;hostVideo.play().catch(()=>{});
 }catch(e){hostTag.textContent='KAMERA TIDAK DAPAT DIAKTIFKAN';console.error(e)}
}
function stopCamera(){
 if(hostVideo.srcObject){hostVideo.srcObject.getTracks().forEach(t=>t.stop());hostVideo.srcObject=null}
 stopHostVideo();
 hostTag.textContent='HOST STANDBY';
}
function showGiftNotice(data){
 giftNoticeImg.src=data.badgeImg||'';
 giftNoticeText.textContent=(data.senderName||'Host')+' mengirim '+(data.giftTitle||'Gift')+' ke '+(data.targetSlot?'Kotak '+data.targetSlot:'Host');
 giftNotice.style.display='flex';
 clearTimeout(giftNoticeTimer);
 giftNoticeTimer=setTimeout(()=>giftNotice.style.display='none',3000);
}

/* Gift video: fallback tampilan video biasa.
   Jika file memiliki latar hijau/hitam, gunakan video transparan yang sudah diproses
   pada file sumber untuk hasil terbaik. */
async function playGiftVideo(blob){
 if(!blob)return;
 return new Promise(resolve=>{
  const url=URL.createObjectURL(blob);
  giftOverlay.style.display='block';
  giftVideo.src=url;
  giftVideo.currentTime=0;
  giftVideo.onended=()=>{
   giftOverlay.style.display='none';
   giftVideo.pause();giftVideo.removeAttribute('src');giftVideo.load();
   URL.revokeObjectURL(url);resolve();
  };
  giftVideo.onerror=()=>{
   giftOverlay.style.display='none';URL.revokeObjectURL(url);resolve();
  };
  giftVideo.play().catch(()=>{
   giftOverlay.style.display='none';URL.revokeObjectURL(url);resolve();
  });
 });
}
function handleGift(data){
 showGiftNotice(data);
 if(data.targetSlot&&slotData[data.targetSlot]){
  slotData[data.targetSlot].points=(Number(slotData[data.targetSlot].points)||0)+(Number(data.increment)||0);
  renderSlot(data.targetSlot);
 }
 if(data.videoBlob){
  giftQueue=giftQueue.then(()=>playGiftVideo(data.videoBlob)).catch(console.error);
 }
}

channel.onmessage=async event=>{
 const d=event.data||{};
 switch(d.type){
  case 'CHANGE_LAYOUT':
   applyLayout(d.layoutId||d.layout?.id);
   break;
  case 'UPDATE_HOST':
   updateHost(d.hostName,d.hostAvatar);
   break;
  case 'TRIGGER_DISPLAY_CAMERA':
   if(d.action==='start')await startCamera();
   else stopCamera();
   break;
  case 'SET_HOST_VIDEO':
   stopCamera();playHostBlob(d.videoBlob);
   hostTag.textContent='VIDEO HOST';
   break;
  case 'RESET_HOST_MEDIA':
   stopCamera();hostTag.textContent='HOST STANDBY';
   break;
  case 'UPDATE_SLOT':{
   const i=Number(d.slotNum);
   if(!slotData[i])break;
   if(d.action==='clear_slot'){
    slotData[i]={name:'Kotak '+i,username:'',avatar:'',points:0,active:false};
   }else{
    slotData[i].name=d.nameInput||'Peserta '+i;
    slotData[i].username=d.username||'';
    slotData[i].avatar=d.profileImg||'';
    slotData[i].points=Number(d.initialPoin)||0;
    slotData[i].active=true;
   }
   renderSlot(i);
   break;
  }
  case 'PLAY_GIFT':
   handleGift(d);
   break;
 }
};
applyLayout(layoutId);
for(let i=1;i<=8;i++)renderSlot(i);
</script>
</body>
</html>
