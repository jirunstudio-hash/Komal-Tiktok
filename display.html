<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Studio - TikTok Live HD</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
            background-color: transparent; 
            color: #fff; 
            width: 1080px; 
            height: 1920px; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
        }

        /* KOTAK KANVAS UTAMA (1080 x 1920 PX) */
        .phone-screen { 
            width: 1080px; 
            height: 1920px;
            background: #000; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            /* Jarak aman atas (safe zone) 240px agar bebas dari UI profil host di HP */
            padding: 240px 24px 0 24px; 
            border-radius: 0;
        }

        /* ===== AREA ATAS: HOST & KOMAL 1 - 8 ===== */
        .live-layout { 
            display: flex; 
            gap: 16px; 
            width: 100%; 
            max-width: 1032px; 
            position: relative; 
            z-index: 10; 
            align-items: stretch; 
        }

        /* ANIMASI GARIS BIRU KEDAP-KEDIP PADA HOST */
        @keyframes hostBluePulse {
            0%, 100% {
                border-color: #00d2ff;
                box-shadow: 0 0 24px rgba(0, 210, 255, 0.75), inset 0 0 16px rgba(0, 210, 255, 0.35);
            }
            50% {
                border-color: rgba(0, 150, 255, 0.25);
                box-shadow: 0 0 4px rgba(0, 150, 255, 0.1), inset 0 0 0px rgba(0, 0, 0, 0);
            }
        }

        /* KOTAK HOST */
        .host-box { 
            flex: 1; 
            height: 980px; /* Pas dengan total tinggi 4 baris komal */
            background: #16161c; 
            border-radius: 0; 
            overflow: hidden; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: 4px solid #00d2ff; 
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            animation: hostBluePulse 1.2s infinite ease-in-out;
        }
        .host-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
        #hostCameraImg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: none; }
        .host-placeholder { color: #888; font-size: 1.6rem; font-weight: 500; text-align: center; z-index: 1; }

        /* BADGE HOST EMAS */
        .host-top-pill { position: absolute; top: 16px; left: 16px; z-index: 12; }
        .gold-host-badge { 
            background: linear-gradient(135deg, #e5a93c 0%, #d48b17 100%); 
            color: #fff; font-size: 1.15rem; font-weight: 800; padding: 4px 14px; 
            border-radius: 6px; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .host-bottom-pill { 
            position: absolute; bottom: 16px; left: 16px; max-width: calc(100% - 32px);
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px); 
            border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 8px 18px; z-index: 12; 
        }
        .host-bottom-text { font-size: 1.2rem; color: #fff; font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* GRID KOMAL (KOTAK 1 - 8) */
        .komal-grid { 
            width: 480px; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(4, 1fr); 
            gap: 12px; 
            flex-shrink: 0; 
            position: relative; 
            z-index: 10; 
        }

        /* KOTAK SLOT KOMAL */
        .slot-box { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            background: #202127; 
            border-radius: 0; 
            position: relative; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            border: 2px solid rgba(255, 255, 255, 0.22); 
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            transition: all 0.25s ease;
        }

        /* 1. LATAR BELAKANG BLUR */
        .slot-bg-blur {
            position: absolute !important;
            inset: -40px !important;
            width: calc(100% + 80px) !important;
            height: calc(100% + 80px) !important;
            object-fit: cover !important;
            filter: blur(20px) brightness(0.65) contrast(1.05) !important;
            transform: scale(1.2) !important;
            display: none;
            z-index: 1;
            pointer-events: none;
        }
        .slot-bg-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            display: none;
            z-index: 2;
            pointer-events: none;
        }

        /* 2. TAMPILAN STANDBY / KOTAK KOSONG */
        .slot-icon { color: #6b6f7d; font-size: 3rem; margin-bottom: 4px; font-weight: 300; z-index: 3; line-height: 1; }
        .slot-req { color: #767a89; font-size: 1.1rem; font-weight: 500; letter-spacing: 0.2px; z-index: 3; }

        /* 3. FOTO PROFIL BULAT DI TENGAH */
        .slot-circle-img { 
            width: 105px; height: 105px; 
            border-radius: 50%; object-fit: cover; 
            display: none; position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 4; 
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
        }

        /* 4. BADGE KOIN CYAN NEON DI KIRI ATAS */
        .slot-coin-badge { 
            position: absolute; top: 12px; left: 12px; 
            display: flex; align-items: center; gap: 8px; 
            background: rgba(0, 0, 0, 0.65); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 4px 14px 4px 6px; 
            border-radius: 999px; z-index: 6; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .cyan-diamond-circle { 
            width: 28px; height: 28px; 
            background: radial-gradient(circle, #ffffff 18%, #38bdf8 65%, #0284c7 100%); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.9);
            flex-shrink: 0;
        }
        .diamond-svg { width: 14px; height: 14px; fill: #ffffff; }
        .coin-count { font-size: 1.1rem; color: #ffffff; font-weight: 800; letter-spacing: 0.2px; line-height: 1; }

        /* BADGE KANAN ATAS */
        .slot-top-badge {
            position: absolute; top: 12px; right: 12px; z-index: 6;
            width: 32px; height: 32px; display: none;
            object-fit: contain;
        }

        /* 5. PILL NAMA DI KIRI BAWAH */
        .slot-name-pill { 
            position: absolute; bottom: 12px; left: 12px; 
            max-width: calc(100% - 64px); 
            display: flex; align-items: center; gap: 6px; z-index: 6; 
            background: rgba(0, 0, 0, 0.65); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 5px 8px 5px 12px; border-radius: 999px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .slot-name-text { 
            color: #ffffff; font-size: 1rem; font-weight: 700; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; 
            line-height: 1.1;
        }
        .slot-plus-circle { 
            width: 24px; height: 24px; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.28); 
            display: flex; align-items: center; justify-content: center; 
            color: #ffffff; font-size: 1.2rem; font-weight: 900; 
            line-height: 1; flex-shrink: 0;
        }

        /* 6. TOMBOL MIC BULAT KANAN BAWAH */
        .mic-container { 
            position: absolute; bottom: 12px; right: 12px; z-index: 6; 
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; 
            background: rgba(0, 0, 0, 0.65); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .mic-icon-svg { width: 20px; height: 20px; fill: #ffffff; }

        /* ===== AREA VIDEO GIFT ===== */
        .gift-overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 1080px; height: 1920px; 
            z-index: 50; 
            pointer-events: none; 
            display: none; 
            background: transparent; 
        }
        #giftVideo { display: none; }
        #giftCanvas { 
            width: 100%; height: 100%; 
            object-fit: contain; object-position: center bottom;
            position: absolute; top: 0; left: 0; 
        }
    </style>
</head>
<body>

    <div class="phone-screen" id="displayContainer">
        <!-- AREA ATAS (HOST & KOTAK 1 - 8) -->
        <div class="live-layout">
            <div class="host-box" id="hostBox">
                <div class="host-top-pill"><span class="gold-host-badge">Host</span></div>
                <div id="hostPlaceholder" class="host-placeholder">Host Video / Kamera</div>
                <video id="hostVideo" class="host-video" loop autoplay playsinline muted></video>
                <img id="hostCameraImg" alt="Host Cam">
                <div class="host-bottom-pill"><span class="host-bottom-text" id="hostBottomText">Faz Gading</span></div>
            </div>

            <div class="komal-grid" id="komalGrid">
                <script>
                    for(let i = 1; i <= 8; i++) {
                        document.write(`
                            <div class="slot-box" id="slot-${i}">
                                <img id="bg-slot-${i}" class="slot-bg-blur" referrerpolicy="no-referrer">
                                <div class="slot-bg-overlay" id="overlay-slot-${i}"></div>

                                <div class="slot-coin-badge" id="coin-badge-${i}" style="display:none;">
                                    <div class="cyan-diamond-circle">
                                        <svg class="diamond-svg" viewBox="0 0 24 24"><path d="M12 2L4 9l8 13 8-13-8-7z"/></svg>
                                    </div>
                                    <span class="coin-count" id="coincount-slot-${i}">0</span>
                                </div>

                                <img class="slot-top-badge" id="topbadge-slot-${i}">

                                <span class="slot-icon" id="icon-${i}">+</span>
                                <span class="slot-req" id="req-${i}">Permintaan</span>
                                
                                <img id="img-slot-${i}" class="slot-circle-img" referrerpolicy="no-referrer">
                                
                                <div class="slot-name-pill" id="namepill-slot-${i}" style="display:none;">
                                    <span class="slot-name-text" id="nametext-slot-${i}">Slot ${i}</span>
                                    <div class="slot-plus-circle">+</div>
                                </div>

                                <div class="mic-container" id="mic-slot-${i}" style="display:none;">
                                    <svg class="mic-icon-svg" viewBox="0 0 24 24">
                                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                                    </svg>
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>

        <!-- AREA VIDEO GIFT -->
        <div class="gift-overlay" id="giftOverlayContainer">
            <video id="giftVideo" crossorigin="anonymous" playsinline></video>
            <canvas id="giftCanvas"></canvas>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('tiktok_live_channel');
        const slotPoints = {};
        for(let i=1; i<=8; i++) slotPoints[i] = 0;

        document.body.addEventListener('click', () => {
            const hVid = document.getElementById('hostVideo');
            if(hVid.paused && hVid.src) hVid.play().catch(()=>{});
        }, { once: true });

        function updateSlotDisplay(data) {
            const { slotNum, nameInput, initialPoin, profileImg, action, badgeImg } = data;
            const slotBox = document.getElementById(`slot-${slotNum}`);
            const coinBadge = document.getElementById(`coin-badge-${slotNum}`);
            const coincountElem = document.getElementById(`coincount-slot-${slotNum}`);
            const namePill = document.getElementById(`namepill-slot-${slotNum}`);
            const nameText = document.getElementById(`nametext-slot-${slotNum}`);
            const micContainer = document.getElementById(`mic-slot-${slotNum}`);
            const imgElem = document.getElementById(`img-slot-${slotNum}`);
            const bgElem = document.getElementById(`bg-slot-${slotNum}`);
            const bgOverlay = document.getElementById(`overlay-slot-${slotNum}`);
            const iconElem = document.getElementById(`icon-${slotNum}`);
            const reqElem = document.getElementById(`req-${slotNum}`);
            const topBadge = document.getElementById(`topbadge-slot-${slotNum}`);

            if (action === 'clear_slot') {
                imgElem.style.display = 'none';
                imgElem.removeAttribute('src');
                if (bgElem) {
                    bgElem.style.display = 'none';
                    bgElem.removeAttribute('src');
                }
                if (bgOverlay) bgOverlay.style.display = 'none';
                if (slotBox) slotBox.style.background = '#202127';

                iconElem.style.display = 'inline-block';
                reqElem.style.display = 'inline-block';
                namePill.style.display = 'none';
                micContainer.style.display = 'none';
                coinBadge.style.display = 'none';
                if (topBadge) topBadge.style.display = 'none';
                slotPoints[slotNum] = 0;
                return;
            }

            if (initialPoin !== undefined) {
                slotPoints[slotNum] = initialPoin;
            }
            coincountElem.innerText = formatPoin(slotPoints[slotNum]);
            coinBadge.style.display = 'flex';

            if (nameInput) {
                nameText.innerText = nameInput;
                namePill.style.display = 'flex';
                micContainer.style.display = 'flex';
            }

            if (badgeImg && topBadge) {
                topBadge.src = badgeImg;
                topBadge.style.display = 'block';
            } else if (topBadge) {
                topBadge.style.display = 'none';
            }

            if (profileImg) {
                iconElem.style.display = 'none';
                reqElem.style.display = 'none';

                imgElem.src = profileImg;
                imgElem.style.display = 'block';

                if (bgElem) {
                    bgElem.src = profileImg;
                    bgElem.style.display = 'block';
                }
                if (bgOverlay) bgOverlay.style.display = 'block';
            }
        }

        channel.onmessage = (event) => {
            const data = event.data;

            if (data.type === 'UPDATE_HOST_LABEL') {
                document.getElementById('hostBottomText').innerText = data.label || 'Nama';
            } 
            else if (data.type === 'UPDATE_HOST_VIDEO') {
                document.getElementById('hostCameraImg').style.display = 'none';
                const videoElem = document.getElementById('hostVideo');
                const placeholder = document.getElementById('hostPlaceholder');
                if(videoElem.src !== data.src) {
                    videoElem.src = data.src;
                    videoElem.load();
                }
                videoElem.style.display = 'block';
                placeholder.style.display = 'none';
                videoElem.play().catch(() => {});
            } 
            else if (data.type === 'HOST_CAM_FRAME') {
                const camImg = document.getElementById('hostCameraImg');
                const placeholder = document.getElementById('hostPlaceholder');
                const videoElem = document.getElementById('hostVideo');

                if (videoElem.style.display !== 'none') videoElem.style.display = 'none';
                if (placeholder.style.display !== 'none') placeholder.style.display = 'none';

                camImg.src = data.frame;
                camImg.style.display = 'block';
            }
            else if (data.type === 'HOST_CAM_STOP') {
                const camImg = document.getElementById('hostCameraImg');
                const placeholder = document.getElementById('hostPlaceholder');
                camImg.style.display = 'none';
                camImg.src = "";
                placeholder.style.display = 'block';
            }
            else if (data.type === 'UPDATE_SLOT') {
                updateSlotDisplay(data);
            }
            else if (data.type === 'PLAY_GIFT') {
                const targetSlot = data.targetSlot;
                if (targetSlot && slotPoints[targetSlot] !== undefined) {
                    slotPoints[targetSlot] += (data.increment || 44999);
                    document.getElementById(`coincount-slot-${targetSlot}`).innerText = formatPoin(slotPoints[targetSlot]);
                }
                playGiftVideo(data.src);
            }
        };

        function formatPoin(val) {
            if (!val || val === 0) return '0';
            if (val >= 1000000) {
                return (val / 1000000).toFixed(1).replace('.', ',') + 'M';
            } else if (val >= 1000) {
                return (val / 1000).toFixed(1).replace('.', ',') + 'K';
            }
            return val.toLocaleString('id-ID');
        }

        function playGiftVideo(src) {
            const overlayContainer = document.getElementById('giftOverlayContainer');
            const giftVideo = document.getElementById('giftVideo');
            const canvas = document.getElementById('giftCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            overlayContainer.style.display = 'block';
            if(giftVideo.src !== src) {
                giftVideo.src = src;
                giftVideo.load();
            }
            giftVideo.currentTime = 0;

            giftVideo.play().then(() => {
                function renderFrame() {
                    if (giftVideo.paused || giftVideo.ended) {
                        overlayContainer.style.display = 'none';
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        return;
                    }
                    if (giftVideo.videoWidth > 0 && giftVideo.videoHeight > 0) {
                        if (canvas.width !== giftVideo.videoWidth || canvas.height !== giftVideo.videoHeight) {
                            canvas.width = giftVideo.videoWidth;
                            canvas.height = giftVideo.videoHeight;
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                        }

                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(giftVideo, 0, 0, canvas.width, canvas.height);

                        try {
                            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const pixels = frame.data;

                            for (let i = 0; i < pixels.length; i += 4) {
                                let r = pixels[i];
                                let g = pixels[i + 1];
                                let b = pixels[i + 2];

                                let maxRB = Math.max(r, b);
                                let greenDiff = g - maxRB;

                                if (greenDiff > 8 && g > 35) {
                                    let alphaFactor = Math.min(1, (greenDiff - 8) / 20);
                                    pixels[i + 3] = Math.floor((1 - alphaFactor) * 255);
                                } 
                                else if (pixels[i + 3] > 0 && g > (r + b) * 0.52) {
                                    pixels[i + 1] = Math.floor((r + b) / 2);
                                }

                                let brightness = Math.max(r, Math.max(g, b));
                                if (brightness < 42) {
                                    let blackAlpha = Math.max(0, (brightness - 10) / 32);
                                    pixels[i + 3] = Math.min(pixels[i + 3], Math.floor(blackAlpha * 255));
                                }
                            }
                            ctx.putImageData(frame, 0, 0);
                        } catch (e) {}
                    }
                    requestAnimationFrame(renderFrame);
                }
                requestAnimationFrame(renderFrame);
            }).catch(() => {
                overlayContainer.style.display = 'none';
            });
        }
    </script>
</body>
</html>
